specificationVersion: jobtemplate-2023-09
name: vLLM Batch Inference
description: "Batch inference using vLLM on a JSONL file of prompts. Each prompt becomes\n\
  one task. The model is loaded once per worker session via a step environment\nthat\
  \ starts a vLLM server \u2014 the scheduler distributes tasks across available\n\
  workers, reusing the loaded model for every task on that worker.\n\nDependencies\
  \ (vLLM, PyTorch) are provided by the queue's Conda queue\nenvironment via the CondaPackages\
  \ parameter. Your queue must have a Conda\nqueue environment configured.\n"
parameterDefinitions:
- name: ModelName
  type: STRING
  default: Qwen/Qwen2.5-7B-Instruct
  description: HuggingFace model ID.
  userInterface:
    control: LINE_EDIT
    label: Model Name
    groupLabel: Model Settings
- name: InputFile
  type: PATH
  objectType: FILE
  dataFlow: IN
  description: JSONL file with one prompt per line. Each line must have a "prompt"
    field.
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: Input JSONL File
    groupLabel: Input
- name: OutputDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: OUT
  description: Directory for per-task results and the final output.
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Output Directory
    groupLabel: Output
- name: Prompts
  type: STRING
  default: "1-10"
  description: "Which lines from the JSONL file to process as tasks. Examples: '1-10' (lines 1 through 10), '2-8' (subset), '2,5,8-9' (specific lines and a range), '1,3,5,7,9' (specific lines)."
  userInterface:
    control: LINE_EDIT
    label: Prompt Range
    groupLabel: Job Settings
- name: MaxTokens
  type: INT
  default: 512
  minValue: 1
  maxValue: 32768
  description: Maximum output tokens per completion.
  userInterface:
    control: SPIN_BOX
    label: Max Output Tokens
    groupLabel: Generation Settings
- name: Temperature
  type: STRING
  default: '0.7'
  description: Sampling temperature (0.0 = deterministic).
  userInterface:
    control: LINE_EDIT
    label: Temperature
    groupLabel: Generation Settings
- name: GpuMemoryUtilization
  type: STRING
  default: '0.90'
  description: Fraction of GPU memory for vLLM KV cache.
  userInterface:
    control: LINE_EDIT
    label: GPU Memory Utilization
    groupLabel: Model Settings
- name: MaxModelLen
  type: INT
  default: 4096
  minValue: 512
  maxValue: 32768
  description: Max sequence length for vLLM.
  userInterface:
    control: SPIN_BOX
    label: Max Model Length
    groupLabel: Model Settings
- name: HfToken
  type: STRING
  default: ''
  description: HuggingFace token for gated models. Leave empty if not needed.
  userInterface:
    control: LINE_EDIT
    label: HuggingFace Token
    groupLabel: Model Settings
- name: JobScriptDir
  description: Directory containing bundled scripts.
  type: PATH
  objectType: DIRECTORY
  dataFlow: IN
  default: scripts
  userInterface:
    control: HIDDEN
- name: CondaPackages
  type: STRING
  # prometheus-fastapi-instrumentator>=8.0.2 is pinned to fix the
  # `_IncludedRouter has no attribute path` bug that breaks vLLM 0.19.1
  # when paired with FastAPI>=0.116. Remove the pin when upgrading vLLM
  # to a version that declares a compatible instrumentator dependency.
  default: python=3.11 vllm=0.19.1=cuda* cuda-toolkit=12.9 prometheus-fastapi-instrumentator=8.0.2
  userInterface:
    control: HIDDEN
- name: CondaChannels
  type: STRING
  default: conda-forge
  userInterface:
    control: HIDDEN
jobEnvironments:
- name: UnbufferedOutput
  variables:
    PYTHONUNBUFFERED: 'True'
steps:
- name: Infer
  parameterSpace:
    taskParameterDefinitions:
    - name: PromptIndex
      type: INT
      range: '{{Param.Prompts}}'
  stepEnvironments:
  - name: VllmServer
    description: Starts a vLLM server that persists across all tasks on this worker.
    script:
      actions:
        onEnter:
          command: bash
          args:
          - '{{Env.File.Enter}}'
        onExit:
          command: bash
          args:
          - '{{Env.File.Exit}}'
      embeddedFiles:
      - name: Enter
        filename: start-vllm.sh
        type: TEXT
        data: |
          #!/bin/bash
          set -euo pipefail

          export HF_TOKEN="{{Param.HfToken}}"

          # Bypass user-local site-packages (~/.local/lib/...) so Python only uses
          # the conda env. Avoids conflicts with stale packages on the worker AMI
          # (e.g. old typing_extensions missing TypeIs that breaks newer Starlette).
          export PYTHONNOUSERSITE=1

          echo "Starting vLLM server for {{Param.ModelName}}..."
          VLLM_LOG="{{Session.WorkingDirectory}}/vllm_server.log"
          echo "openjd_env: VLLM_LOG=$VLLM_LOG"

          # --enforce-eager disables CUDA graph capture (~20-30% throughput cost)
          # but prevents hangs on some AMI/driver combos at startup. Remove it
          # (and test) for maximum throughput on a known-good GPU fleet.
          nohup python -m vllm.entrypoints.openai.api_server \
            --model "{{Param.ModelName}}" \
            --dtype auto \
            --port 8000 \
            --gpu-memory-utilization {{Param.GpuMemoryUtilization}} \
            --max-model-len {{Param.MaxModelLen}} \
            --no-enable-log-requests \
            --enforce-eager \
            > "$VLLM_LOG" 2>&1 &
          VLLM_PID=$!
          echo "openjd_env: VLLM_PID=$VLLM_PID"

          # Wait for server to be ready using the embedded Python wait script
          python "{{Env.File.WaitScript}}" "$VLLM_PID" "$VLLM_LOG"
      - name: WaitScript
        filename: wait_for_vllm.py
        type: TEXT
        data: "import sys, os, time, urllib.request\n\npid = int(sys.argv[1])\nlog_path\
          \ = sys.argv[2]\nstart = time.time()\nmax_wait = 300\nlast_log_size = 0\n\
          \nwhile time.time() - start < max_wait:\n    try:\n        os.kill(pid,\
          \ 0)\n    except OSError:\n        print(\"ERROR: vLLM exited unexpectedly\"\
          , flush=True)\n        try:\n            with open(log_path) as f:\n   \
          \             print(f.read()[-4000:])\n        except Exception:\n     \
          \       pass\n        sys.exit(1)\n\n    try:\n        urllib.request.urlopen(\"\
          http://localhost:8000/v1/models\", timeout=5)\n        print(f\"vLLM ready\
          \ after {int(time.time() - start)}s\", flush=True)\n        sys.exit(0)\n\
          \    except Exception:\n        pass\n\n    # Print progress every 30 seconds\n\
          \    elapsed = int(time.time() - start)\n    if elapsed > 0 and elapsed\
          \ % 30 < 5:\n        try:\n            with open(log_path) as f:\n     \
          \           f.seek(last_log_size)\n                new_content = f.read()\n\
          \                last_log_size = f.tell()\n                if new_content:\n\
          \                    print(f\"--- vLLM log (t={elapsed}s) ---\", flush=True)\n\
          \                    print(new_content[-2000:], flush=True)\n        except\
          \ Exception:\n            pass\n\n    time.sleep(5)\n\nprint(f\"ERROR: vLLM\
          \ did not start within {max_wait}s\", flush=True)\ntry:\n    with open(log_path)\
          \ as f:\n        print(f.read()[-4000:])\nexcept Exception:\n    pass\n\
          sys.exit(1)\n"
      - name: Exit
        filename: stop-vllm.sh
        type: TEXT
        data: '#!/bin/bash

          set -euo pipefail

          echo "Stopping vLLM server (PID $VLLM_PID)..."

          kill "$VLLM_PID" 2>/dev/null || true

          wait "$VLLM_PID" 2>/dev/null || true

          echo "vLLM server stopped."

          '
  script:
    actions:
      onRun:
        command: python
        args:
        - '{{Param.JobScriptDir}}/run_task.py'
        - --input-file
        - '{{Param.InputFile}}'
        - --prompt-index
        - '{{Task.Param.PromptIndex}}'
        - --output-dir
        - '{{Param.OutputDir}}/output/results'
        - --max-tokens
        - '{{Param.MaxTokens}}'
        - --temperature
        - '{{Param.Temperature}}'
        - --model
        - '{{Param.ModelName}}'
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - linux
    amounts:
    - name: amount.worker.gpu
      min: 1
    - name: amount.worker.memory
      min: 32768
- name: Aggregate
  dependencies:
  - dependsOn: Infer
  script:
    actions:
      onRun:
        command: python
        args:
        - '{{Param.JobScriptDir}}/aggregate.py'
        - --results-dir
        - '{{Param.OutputDir}}/output/results'
        - --output
        - '{{Param.OutputDir}}/output/output.jsonl'
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - linux
