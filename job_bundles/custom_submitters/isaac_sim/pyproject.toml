[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deadline-cloud-for-isaac-sim"
# A preview published as a sample; bump when this sample changes.
version = "0.1.0.dev1"
readme = "README.md"
license = "MIT-0"
requires-python = ">=3.10"
description = "AWS Deadline Cloud for Isaac Sim: an app and an Isaac Sim extension to load job outputs and submit job bundles"
authors = [
  {name = "Amazon Web Services"},
]
# https://pypi.org/classifiers/
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "License :: OSI Approved :: MIT No Attribution License (MIT-0)",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  # This package is not published to PyPI; PyPI rejects uploads with this classifier.
  "Private :: Do Not Upload",
]
dependencies = [
  # 0.60.4 is the floor below which pip backtracks past the extras instead of failing.
  # [console] pulls awscrt, which the Deadline Cloud Monitor login credential provider needs.
  "deadline[console] >= 0.60.4",
  "boto3 >= 1.34",
]

[project.optional-dependencies]
# PySide6 for the app (`deadline-physical-ai gui`) and the `deadline bundle gui-submit`
# dialog it opens.
gui = [
  "deadline[gui] >= 0.60.4",
]

[project.scripts]
# The Isaac Sim extension runs this exact command name (`deadline-physical-ai gui --bridge`).
deadline-physical-ai = "deadline.physical_ai.cli:main"

[project.urls]
Homepage = "https://github.com/aws-deadline/deadline-cloud-samples/tree/mainline/job_bundles/custom_submitters/isaac_sim"
Source = "https://github.com/aws-deadline/deadline-cloud-samples/tree/mainline/job_bundles/custom_submitters/isaac_sim"

[tool.hatch.build.targets.sdist]
include = [
  "src/*",
  "hatch_build.py",
]

[tool.hatch.build.targets.wheel]
# Ships every file under src/deadline, including the Kit extension folder
# deadline/isaac_sim_submitter/kit_extension/isaacsim.deadline.submitter/ as package data.
packages = [
  "src/deadline",
]
# hatch_build.py adds a copy of extension.toml stamped with the package version instead.
exclude = [
  "src/deadline/isaac_sim_submitter/kit_extension/isaacsim.deadline.submitter/config/extension.toml",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.mypy]
check_untyped_defs = true
show_error_codes = true
pretty = true
files = ["src", "test"]
ignore_missing_imports = true
# Tell mypy that there's a namespace package src/deadline
namespace_packages = true
explicit_package_bases = true
# The Kit extension folder is not a Python package path of its own (its name has dots), so it
# is not walked as part of src/; its isaacsim.deadline.submitter modules are found through
# mypy_path instead, and checked when the tests import them.
mypy_path = "src,src/deadline/isaac_sim_submitter/kit_extension/isaacsim.deadline.submitter"
exclude = ["^src/deadline/isaac_sim_submitter/kit_extension/"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
  "deadline",
]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
xfail_strict = true
addopts = [
  "--durations=5",
  "--color=yes",
  "--cov=src/deadline/isaac_sim_adaptor",
  "--cov=src/deadline/isaac_sim_submitter",
  "--cov=src/deadline/physical_ai",
  "--cov-report=html:build/coverage",
  "--cov-report=xml:build/coverage/coverage.xml",
  "--cov-report=term-missing",
]
testpaths = ["test"]

[tool.coverage.run]
source_pkgs = [
  "deadline.isaac_sim_adaptor",
  "deadline.isaac_sim_submitter",
  "deadline.physical_ai",
]
branch = true
parallel = true
omit = [
  "**/__main__.py",
  "**/_version.py",
]

[tool.coverage.paths]
source = [
  "src/",
]

[tool.coverage.report]
show_missing = true
