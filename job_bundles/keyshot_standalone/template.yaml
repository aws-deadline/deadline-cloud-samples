specificationVersion: 'jobtemplate-2023-09'
extensions:
  - TASK_CHUNKING
name: KeyShot Standalone with Non-Contiguous Chunks
description: |
  A job bundle that renders KeyShot scenes with task chunking support.
  Uses keyshot_headless command on Windows with non-contiguous frame ranges.

parameterDefinitions:

# KeyShot Scene Settings
- name: KeyShotFile
  description: The KeyShot scene file to render.
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: KeyShot Scene File
    fileFilters:
    - label: KeyShot Scene Files
      patterns:
      - '*.bip'
    - label: All Files
      patterns:
      - '*'
- name: Frames
  description: The frames to render. E.g. 1-3,8,11-100:2
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Frames
  default: "1-3,8,11-100:2"
  minLength: 1
- name: ChunkSize
  description: Number of frames per chunk.
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Chunk Size
  default: 5
  minValue: 1
- name: TargetRuntime
  description: Target runtime per chunk in seconds (0 to disable adaptive chunking).
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Target Runtime (Seconds)
  default: 300

# KeyShot Output Settings
- name: OutputName
  description: The file name prefix to save out each frame with
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Output File Name
  default: KeyShotOutput
- name: OutputDirectoryPath
  description: The render output directory
  type: PATH
  objectType: DIRECTORY
  dataFlow: OUT
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Output Directory Path
- name: OutputFormat
  description: The render output format
  type: STRING
  allowedValues:
    [
      "PNG",
      "JPEG",
      "EXR",
      "TIFF8",
      "TIFF32",
      "PSD8",
      "PSD16",
      "PSD32"
    ]
  default: PNG
  userInterface:
    control: DROPDOWN_LIST
    label: Output Format

# Software Environment
- name: CondaPackages
  type: STRING
  userInterface:
    control: HIDDEN
  default: keyshot
  description: Conda packages to install. Requires a Queue Environment to create the Conda Environment.

steps:
- name: Render
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: CHUNK[INT]
      range: "{{Param.Frames}}"
      chunks:
        defaultTaskCount: "{{Param.ChunkSize}}"
        targetRuntimeSeconds: "{{Param.TargetRuntime}}"
        # KeyShot renders frames via Python script, supports any frame list
        rangeConstraint: NONCONTIGUOUS
  script:
    actions:
      onRun:
        command: keyshot_headless
        args:
        - -progress
        - -floating_feature
        - keyshot2
        - '{{Param.KeyShotFile}}'
        - -script
        - '{{Task.File.KeyShotScript}}'
    embeddedFiles:
      - name: KeyShotScript
        filename: KeyShotScript.py
        type: TEXT
        data: |
          import re

          def parse_frame_range(range_expr):
              """Parse OpenJD range expression into list of frames."""
              int_pat = r"\s*(-?[0-9]+)\s*"
              part_re = re.compile(f"^{int_pat}(?:-{int_pat}(?::{int_pat})?)?$")
              frames = []
              for part in range_expr.split(","):
                  m = part_re.match(part)
                  if m:
                      start, end, step = m.groups()
                      if step is not None:
                          step = int(step)
                          frames.extend(range(int(start), int(end) + (step // abs(step)), step))
                      elif end is not None:
                          frames.extend(range(int(start), int(end) + 1))
                      else:
                          frames.append(int(start))
                  else:
                      raise ValueError(f"Invalid frame range: {range_expr}")
              return frames

          match "{{Param.OutputFormat}}":
            case "JPEG":
              extension = ".jpg"
            case "EXR":
              extension = ".exr"
            case "TIFF8" | "TIFF32":
              extension = ".tif"
            case "PSD8" | "PSD16" | "PSD32":
              extension = ".psd"
            case _:
              extension = ".png"

          opts = lux.getRenderOptions()
          opts.setAddToQueue(False)
          output_format_code = lux.RENDER_OUTPUT_{{Param.OutputFormat}}

          # Parse non-contiguous chunk and render each frame
          frames = parse_frame_range("{{Task.Param.Frame}}")
          print(f"Rendering {len(frames)} frames: {frames}")

          for frame in frames:
              lux.setAnimationFrame(frame)
              output_path = os.path.join(r"{{Param.OutputDirectoryPath}}", f"{{Param.OutputName}}.{frame}" + extension)
              print(f"Rendering frame {frame} to {output_path}")
              lux.renderImage(path=output_path, opts=opts, format=output_format_code)

          print("Finished Rendering")
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - windows
