specificationVersion: jobtemplate-2023-09
extensions: [FEATURE_BUNDLE_1, EXPR]
name: Husk USD Render

parameterDefinitions:
- name: USDSceneFile
  type: path
  default: sample.usda
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: USD Scene File
    groupLabel: Render Parameters
    fileFilters:
    - label: USD Scene Files
      patterns: ["*.usd", "*.usdc", "*.usda", "*.usdz"]
    - label: All Files
      patterns: ["*"]
  description: >
    Choose the USD scene file you want to render. Use the 'Job Attachments' tab
    to add textures and other files that the job needs.
- name: Frames
  type: range_expr
  default: "1"
  userInterface:
    control: LINE_EDIT
    label: Frames
    groupLabel: Render Parameters
- name: OutputDir
  type: path
  default: output/
  objectType: DIRECTORY
  dataFlow: OUT
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Output Directory
    groupLabel: Render Parameters
  description: Choose the render output directory.
- name: OutputPattern
  type: string
  default: "output_$F4"
  userInterface:
    control: LINE_EDIT
    label: Output File Pattern
    groupLabel: Render Parameters
  # Husk Documentation: https://www.sidefx.com/docs/houdini/ref/utils/husk.html#:~:text=Current%20frame%20number%20with%20fixed%20number%20of
  description: Enter the output filename pattern (without extension). Please see the Husk documentation for formatting
- name: Format
  type: string
  default: exr
  allowedValues: ["exr"]
  userInterface:
    control: DROPDOWN_LIST
    label: Output File Format
    groupLabel: Render Parameters
  description: Choose the file format for the output render.
- name: ResolutionX
  type: int
  default: 1024
  userInterface:
    control: SPIN_BOX
    label: Resolution Width
    groupLabel: Render Parameters
  description: >
    Enter the resolution width in pixels. The default is 1024.
- name: ResolutionY
  type: int
  default: 768
  userInterface:
    control: SPIN_BOX
    label: Resolution Height
    groupLabel: Render Parameters
  description: >
    Enter the resolution height in pixels. The default is 768.
- name: Renderer
  type: string
  default: BRAY_HdKarma
  allowedValues: [BRAY_HdKarma, BRAY_HdKarmaXPU, HdVRayRendererPlugin, HdRedshiftRendererPlugin]
  userInterface:
    control: DROPDOWN_LIST
    label: Husk Render Delegate
    groupLabel: Render Parameters
  description: Choose the renderer you wish to use. BRAY_HdKarma uses the CPU while BRAY_HdKarmaXPU requires a GPU fleet. If you select BRAY_HdKarmaXPU your queue must be associated with a GPU fleet.
- name: CondaPackages
  type: string
  userInterface:
    # This parameter is for a queue environment, not used directly in the job,
    # so leave the GUI for the queue environment to display.
    control: HIDDEN
  default: "houdini=20.5"
  description: >
    This parameter provides a default value Conda environment, specifying Houdini 20.5 to provide the husk executable.

steps:
- name: HuskRender
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: "{{ Param.Frames }}"
  bash:
    let:
      - output_path = Param.OutputDir / (Param.OutputPattern + '.' + Param.Format)
    script: |
      set -xeuo pipefail
      mkdir -p {{ repr_sh(Param.OutputDir) }}
      # The 'husk' executable exists on the path when using a Deadline Cloud-provided Houdini conda package
      husk -r {{ Param.ResolutionX }} {{ Param.ResolutionY }} \
           -R {{ Param.Renderer }} \
           -f {{ Task.Param.Frame }} \
           {{ repr_sh(Param.USDSceneFile) }} \
           -o {{ repr_sh(output_path) }}
  hostRequirements:
    # Add this requirement when rendering with the GPU to ensure the job is only scheduled on GPU-enabled fleets.
    # amounts:
    # - name: amount.worker.gpu
    #   min: 1
    attributes:
    # The Houdini package is currently only availabling on Linux in Deadline Cloud SMF
    - name: attr.worker.os.family
      anyOf:
      - linux
