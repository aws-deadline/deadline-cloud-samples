specificationVersion: 'jobtemplate-2023-09'
extensions:
  - TASK_CHUNKING
name: Nuke Render
description: |
  This job bundle renders Nuke scripts using Nuke's headless rendering mode.

  To run it, you will need a Nuke installation available in the PATH in one of the following ways:
    * As a conda package when your queue has a conda queue environment set up to
      provide virtual environments for jobs.
    * Installed on the worker hosts that run the job. You can customize your Deadline Cloud
      queue, fleets, and this job to fit your own production pipeline.

parameterDefinitions:

# Render Parameters
- name: NukeScript
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: Nuke Script File
    groupLabel: Render Parameters
    fileFilters:
    - label: Nuke Script Files
      patterns: ["*.nk"]
    - label: All Files
      patterns: ["*"]
  minLength: 1
  default: "./scene/motionblur3d_10.nk"
  description: >
    Choose the Nuke script file you want to render. Use the 'Job Attachments' tab
    to add additional assets that the job needs.
- name: Frames
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Frames
    groupLabel: Render Parameters
  default: "1-3,5,6-20:2"
  description: Frame range to render (e.g., "1-10", "1,5,10", or "1-100:2").
- name: ChunkSize
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Chunk Size
    groupLabel: Render Parameters
  default: 5
  description: Number of frames to render per chunk.
- name: TargetRuntime
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Target Runtime (Seconds)
    groupLabel: Render Parameters
  default: 180
  description: Target runtime per chunk in seconds (0 to disable adaptive chunking).
- name: ProjectPath
  type: PATH
  objectType: DIRECTORY
  dataFlow: INOUT
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Project Directory
    groupLabel: Render Parameters
  default: "./scene"
  description: Choose the project working directory containing the Nuke script and assets.
- name: OutputDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: OUT
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Output Directory
    groupLabel: Render Parameters
  default: "./scene/nuke_output"
  description: Choose the render output directory.

# Software Environment
- name: CondaPackages
  type: STRING
  userInterface:
    # This parameter is for a queue environment, not used directly in the job,
    # so leave the GUI for the queue environment to display.
    control: HIDDEN
  default: "nuke nuke-openjd"
  description: >
    Conda packages to install for the render.
    Example: "nuke=16.* nuke-openjd" or "nuke nuke-openjd"
- name: RezPackages
  type: STRING
  userInterface:
    # This parameter is for a queue environment, not used directly in the job,
    # so leave the GUI for the queue environment to display.
    control: HIDDEN
  default: "nuke"
  description: >
    If you have a Queue Environment that creates a Rez environment from a parameter called RezPackages, this will
    tell it to install nuke.

steps:
- name: NukeRender
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: CHUNK[INT]
      range: "{{Param.Frames}}"
      chunks:
        defaultTaskCount: "{{Param.ChunkSize}}"
        targetRuntimeSeconds: "{{Param.TargetRuntime}}"
        rangeConstraint: NONCONTIGUOUS
  script:
    actions:
      onRun:
        command: bash
        args: ['{{Task.File.Render}}']
        cancelation:
          mode: NOTIFY_THEN_TERMINATE
    embeddedFiles:
    - name: Render
      type: TEXT
      data: |
        # Configure the task to fail if any individual command fails.
        set -xeuo pipefail

        echo "Nuke script is {{Param.NukeScript}}"
        cd '{{Param.ProjectPath}}'

        # Create output directory if it doesn't exist
        mkdir -p '{{Param.OutputDir}}'

        # Convert OpenJD range expression to Nuke -F flags.
        # E.g. "1-3,5,7-20:2" becomes "-F 1-3 -F 5 -F 7-20x2"
        NUKE_FRAMES=""
        IFS=',' read -ra SEGMENTS <<< "{{Task.Param.Frame}}"
        for seg in "${SEGMENTS[@]}"; do
          NUKE_FRAMES="$NUKE_FRAMES -F $(echo "$seg" | tr ':' 'x')"
        done

        # Render the chunk using Nuke
        nuke $NUKE_FRAMES \
             --sro -V 2 \
             -x '{{Param.NukeScript}}'
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - linux
