specificationVersion: jobtemplate-2023-09
extensions:
  - TASK_CHUNKING
name: After Effects Render with Contiguous Chunks
description: >
  A job bundle that renders an After Effects composition using aerender
  with task chunking for efficient parallel rendering.

parameterDefinitions:

# Project settings
- name: ProjectFile
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: Project file
    groupLabel: Project settings
    fileFilters:
    - label: After Effects project files
      patterns:
      - "*.aep"
      - "*.aepx"
    - label: All Files
      patterns:
      - "*"
  description: The After Effects project file to render.
- name: CompName
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Comp name
    groupLabel: Project settings
  description: Selected composition to render.

# Inputs/outputs
- name: InputDirectory
  type: PATH
  objectType: DIRECTORY
  dataFlow: IN
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Input directory
    groupLabel: Inputs/outputs
  description: >
    This is the directory for your input files. Any input
    files that are required to render must be included in
    this directory. Generally, the project file should be
    within this directory to ensure relative paths are
    preserved.
- name: OutputDirectory
  type: PATH
  objectType: DIRECTORY
  dataFlow: OUT
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Output directory
    groupLabel: Inputs/outputs
  description: The render output directory.

# Frame range
- name: Frames
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Frames
    groupLabel: Frame range
  default: "0-50"
  description: The frame range to render (e.g., 0-100).
- name: ChunkSize
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Chunk Size
    groupLabel: Frame range
  default: 10
  minValue: 1
  description: Number of frames per chunk.
- name: TargetRuntime
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Target Runtime (Seconds)
    groupLabel: Frame range
  default: 300
  description: Target runtime per chunk (0 to disable adaptive chunking).

# Software Environment
- name: CondaPackages
  type: STRING
  userInterface:
    control: HIDDEN
  default: aftereffects
  description: >
    If you have a Queue Environment that creates a Conda environment from a parameter called CondaPackages, this
    will set the default packages to use for the job.

steps:
- name: RenderComp
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: CHUNK[INT]
      range: "{{Param.Frames}}"
      chunks:
        defaultTaskCount: "{{Param.ChunkSize}}"
        targetRuntimeSeconds: "{{Param.TargetRuntime}}"
        # After Effects aerender uses -s (start) and -e (end) for frame ranges
        # https://helpx.adobe.com/after-effects/using/automated-rendering-network-rendering.html
        rangeConstraint: CONTIGUOUS
  script:
    actions:
      onRun:
        command: python
        args:
          - "{{Task.File.Run}}"
    embeddedFiles:
      - name: Run
        type: TEXT
        data: |
          import os
          import subprocess

          # Parse contiguous chunk range (e.g., "0-50" or "10-10")
          chunk = "{{Task.Param.Frame}}"
          start_frame, end_frame = chunk.split("-")

          # Ensure the output directory exists (use raw string to avoid escape sequences)
          os.makedirs(r"{{Param.OutputDirectory}}", exist_ok=True)

          # Run aerender with the chunk's frame range
          cmd = [
              "aerender",
              "-project", r"{{Param.ProjectFile}}",
              "-comp", "{{Param.CompName}}",
              "-output", r"{{Param.OutputDirectory}}/output_[####].png",
              "-s", start_frame,
              "-e", end_frame
          ]
          print(f"Rendering frames {start_frame} to {end_frame}")
          subprocess.run(cmd, check=True)
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - windows
