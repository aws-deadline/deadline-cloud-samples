specificationVersion: jobtemplate-2023-09
extensions: [FEATURE_BUNDLE_1, EXPR]
name: After Effects Render - one task
description: >
  A simple job bundle that allows a user to select
  a project file and enter a comp to render with aerender.

parameterDefinitions:
# Project settings
- name: ProjectFile
  type: path
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: Project file
    groupLabel: Project settings
    fileFilters:
    - label: After Effects project files
      patterns: ["*.aep", "*.aepx"]
    - label: All Files
      patterns: ["*"]
  description: The After Effects project file to render.
- name: CompName
  type: string
  userInterface:
    control: LINE_EDIT
    label: Comp name
    groupLabel: Project settings
  description: Selected composition to render.

# Inputs/outputs
- name: InputDirectory
  type: path
  objectType: DIRECTORY
  dataFlow: IN
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Input directory
    groupLabel: Inputs/outputs
  description: >
    This is the directory for your input files. Any input
    files that are required to render must be included in
    this directory. Generally, the project file should be
    within this directory to ensure relative paths are
    preserved.
- name: OutputDirectory
  type: path
  objectType: DIRECTORY
  dataFlow: OUT
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Output directory
    groupLabel: Inputs/outputs
  description: The render output directory

# Frame range
- name: StartFrame
  type: int
  default: 0
  userInterface:
    control: SPIN_BOX
    label: Start Frame
    groupLabel: Frame range
  description: The first frame to render.
- name: EndFrame
  type: int
  default: 50
  userInterface:
    control: SPIN_BOX
    label: End Frame
    groupLabel: Frame range
  description: >
    The last frame to render, inclusive. aerender renders one contiguous range,
    from StartFrame to EndFrame.

# Software Environment
- name: CondaPackages
  type: string
  default: aftereffects
  userInterface:
    # This parameter is for a queue environment, not used directly in the job,
    # so leave the GUI for the queue environment to display.
    control: HIDDEN
  description: >
    If you have a Queue Environment that creates a Conda environment from a parameter called CondaPackages, this
    will set the default packages to use for the job.

steps:
- name: RenderComp
  python:
    let:
      - output_pattern = Param.OutputDirectory / 'output_[####].png'
    script: |
      import os, subprocess
      os.makedirs({{ repr_py(Param.OutputDirectory) }}, exist_ok=True)
      subprocess.run([
          'aerender',
          '-project', {{ repr_py(Param.ProjectFile) }},
          '-comp', {{ repr_py(Param.CompName) }},
          '-output', {{ repr_py(output_pattern) }},
          '-s', str({{ Param.StartFrame }}),
          '-e', str({{ Param.EndFrame }})
      ], check=True)
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf: [windows]
