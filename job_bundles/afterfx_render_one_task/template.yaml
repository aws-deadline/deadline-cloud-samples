specificationVersion: jobtemplate-2023-09
name: After Effects Render - one task
description: >
  A simple job bundle that allows a user to select
  a project file and enter a comp to render with aerender.

parameterDefinitions:

# Project settings
- name: ProjectFile
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: Project file
    groupLabel: Project settings
    fileFilters:
    - label: After Effects project files
      patterns:
      - "*.aep"
      - "*.aepx"
    - label: All Files
      patterns:
      - "*"
  description: The After Effects project file to render.
- name: CompName
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Comp name
    groupLabel: Project settings
  description: Selected composition to render.

# Inputs/outputs
- name: InputDirectory
  type: PATH
  objectType: DIRECTORY
  dataFlow: IN
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Input directory
    groupLabel: Inputs/outputs
  description: >
    This is the directory for your input files. Any input
    files that are required to render must be included in
    this directory. Generally, the project file should be
    within this directory to ensure relative paths are
    preserved.
- name: OutputDirectory
  type: PATH
  objectType: DIRECTORY
  dataFlow: OUT
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Output directory
    groupLabel: Inputs/outputs
  description: The render output directory

# Frame range
- name: StartFrame
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Start Frame
    groupLabel: Frame range
  default: 0
  description: The first frame to render.
- name: EndFrame
  type: INT
  userInterface:
    control: SPIN_BOX
    label: End Frame
    groupLabel: Frame range
  default: 50
  description: The last frame to render.

# Software Environment
- name: CondaPackages
  type: STRING
  userInterface:
    # This parameter is for a queue environment, not used directly in the job,
    # so leave the GUI for the queue environment to display.
    control: HIDDEN
  default: aftereffects
  description: >
    If you have a Queue Environment that creates a Conda environment from a parameter called CondaPackages, this
    will set the default packages to use for the job.

steps:
- name: RenderComp
  script:
    actions:
      onRun:
        command: python
        args:
          - "{{Task.File.Run}}"
          - "{{Param.OutputDirectory}}"
          - "aerender"
          - "-project"
          - "{{Param.ProjectFile}}"
          - "-comp"
          - "{{Param.CompName}}"
          - "-output"
          - "{{Param.OutputDirectory}}/output_[####].png"
          - "-s"
          - "{{Param.StartFrame}}"
          - "-e"
          - "{{Param.EndFrame}}"
    embeddedFiles:
      - name: Run
        type: TEXT
        data: |
          import os
          import sys
          import subprocess

          # Ensure the output directory exists
          os.makedirs(sys.argv[1], exist_ok=True)

          # Run the After Effects subprocess
          subprocess.run(sys.argv[2:], check=True)
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - windows
