specificationVersion: 'jobtemplate-2023-09'
name: SSM-Managed-Node-Windows
parameterDefinitions:
- name: Message
  type: STRING
  default: Starting SSM Managed Node registration (Windows)
- name: ActivationCode
  type: STRING
  description: >
    SSM hybrid activation code from aws ssm create-activation.
    Generated by the submit script before job submission.
- name: ActivationId
  type: STRING
  description: >
    SSM hybrid activation ID from aws ssm create-activation.
    Generated by the submit script before job submission.
- name: AWS_REGION
  type: STRING
  default: us-west-2
  description: Region where the activation was created.
- name: SessionMinutes
  type: INT
  default: 60
  description: How many minutes to keep the managed node registered and the job alive.
steps:
- name: RegisterSSMNode
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - windows
  script:
    actions:
      onRun:
        command: powershell
        args:
        - '-NoProfile'
        - '-ExecutionPolicy'
        - 'Bypass'
        - '-File'
        - '{{Task.File.Run}}'
        cancelation:
          mode: NOTIFY_THEN_TERMINATE
    embeddedFiles:
    - name: Run
      type: TEXT
      filename: run.ps1
      data: |
        # SSM Managed Node registration (Windows) - hybrid-activation flow
        # The Deadline Cloud AMI ships with SSM Agent pre-installed and registered
        # under an EC2 identity. We:
        #   1. Verify outbound reachability to ssm + ssmmessages in the region.
        #   2. Stop the agent service.
        #   3. Clear the existing (EC2) registration.
        #   4. Register with the hybrid activation (no interactive prompt because
        #      the registration was cleared in step 3).
        #   5. Restart the agent service so it comes up as a hybrid mi-* node.
        # Steps 2-5 run as SYSTEM via the DeadlineSsmElevated scheduled task
        # because job-user has a UAC-filtered admin token.
        $ErrorActionPreference = 'Stop'
        Set-StrictMode -Version Latest

        [Net.ServicePointManager]::SecurityProtocol = `
            [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12

        Write-Host '{{Param.Message}}'
        Write-Host '=============================================='
        Write-Host 'SSM Managed Node Registration (Windows)'
        Write-Host '=============================================='
        Write-Host "User:    $env:USERNAME"
        Write-Host "Host:    $env:COMPUTERNAME"
        Write-Host "Region:  {{Param.AWS_REGION}}"
        Write-Host "Session: {{Param.SessionMinutes}} minutes"
        Write-Host ''

        $elevatedDir = 'C:\ProgramData\Amazon\Deadline\SsmElevated'
        $elevatedTaskName = 'DeadlineSsmElevated'
        $agentExe = 'C:\Program Files\Amazon\SSM\amazon-ssm-agent.exe'

        if (-not (Test-Path $agentExe)) {
            throw "amazon-ssm-agent.exe not found at $agentExe."
        }
        if (-not (Test-Path $elevatedDir)) {
            throw "Elevated-task staging dir not found at $elevatedDir. Host config did not install the DeadlineSsmElevated task."
        }

        # ------------------------------------------------------------------
        # Helper: run a staged script as SYSTEM via the DeadlineSsmElevated
        # scheduled task. Returns the task's exit code. The task's wrapper
        # (installed by host_config.ps1) reads args.json and invokes exe+args,
        # streaming output to run.log.
        # ------------------------------------------------------------------
        function Invoke-ElevatedScript {
            param(
                [Parameter(Mandatory)][string]$ScriptPath,
                [int]$TimeoutSec = 600
            )
            $argsPath = Join-Path $elevatedDir 'args.json'
            $logPath  = Join-Path $elevatedDir 'run.log'
            $exitPath = Join-Path $elevatedDir 'exit.code'
            Remove-Item $argsPath, $logPath, $exitPath -Force -ErrorAction SilentlyContinue

            $spec = @{
                exe  = 'powershell.exe'
                args = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $ScriptPath)
            }
            $spec | ConvertTo-Json -Compress | Set-Content -Path $argsPath -Encoding UTF8

            & schtasks.exe /Run /TN $elevatedTaskName | Out-Null
            if ($LASTEXITCODE -ne 0) {
                throw "schtasks /Run $elevatedTaskName failed with exit code $LASTEXITCODE"
            }

            $deadline = (Get-Date).AddSeconds($TimeoutSec)
            while (-not (Test-Path $exitPath)) {
                if ((Get-Date) -gt $deadline) {
                    throw "Elevated task did not complete within ${TimeoutSec}s."
                }
                Start-Sleep -Seconds 2
            }

            if (Test-Path $logPath) {
                # ReadAllText auto-detects UTF-8/16 BOMs. For no-BOM UTF-16
                # (PS 5.1's `*>>` default) the returned string will contain
                # null bytes between chars; we strip those downstream with
                # `-replace "`0", ''` before regex.
                $logText = [System.IO.File]::ReadAllText($logPath)
                Write-Host '--- elevated task log ---'
                Write-Host $logText
                Write-Host '--- end elevated task log ---'
            } else {
                $logText = ''
            }
            return [pscustomobject]@{
                ExitCode = [int](Get-Content -Raw $exitPath).Trim()
                Log      = $logText
            }
        }

        # ------------------------------------------------------------------
        # Reachability check (runs as job-user; no elevation needed for a
        # plain TCP probe). Fails fast if the VPC can't reach SSM endpoints.
        # ------------------------------------------------------------------
        Write-Host 'Checking SSM endpoint reachability...'
        $region = '{{Param.AWS_REGION}}'
        $endpoints = @(
            "ssm.$region.amazonaws.com",
            "ssmmessages.$region.amazonaws.com",
            "ec2messages.$region.amazonaws.com"
        )
        $unreachable = @()
        foreach ($endpoint in $endpoints) {
            try {
                $r = Test-NetConnection -ComputerName $endpoint -Port 443 -WarningAction SilentlyContinue
                if ($r.TcpTestSucceeded) {
                    Write-Host "  OK   ${endpoint}:443"
                } else {
                    Write-Host "  FAIL ${endpoint}:443 (would block hybrid registration)"
                    $unreachable += $endpoint
                }
            } catch {
                Write-Host "  FAIL ${endpoint}:443 (exception: $_)"
                $unreachable += $endpoint
            }
        }
        if ($unreachable.Count -gt 0) {
            Write-Host ''
            Write-Host ("ERROR: cannot connect to required SSM endpoints: {0}" -f ($unreachable -join ', '))
            Write-Host 'Hybrid registration cannot proceed without outbound HTTPS to the SSM service endpoints.'
            exit 1
        }
        Write-Host ''

        # ------------------------------------------------------------------
        # Stage a SYSTEM-run script that does the full clear+register flow.
        # Keeping it as a single script minimises scheduled-task latency
        # (one schtasks /Run instead of three) and keeps the whole sequence
        # inside a single elevated process.
        # ------------------------------------------------------------------
        $regScript = Join-Path $elevatedDir 'register.ps1'
        $regLines = @(
            "`$ErrorActionPreference = 'Continue'",
            "Write-Host ""Running as: `$env:USERNAME (expected SYSTEM)""",
            "",
            "Write-Host 'Stopping AmazonSSMAgent service...'",
            "Stop-Service -Name AmazonSSMAgent -Force -ErrorAction SilentlyContinue",
            "Start-Sleep -Seconds 3",
            "",
            "Write-Host 'Clearing existing SSM registration (EC2 identity)...'",
            "& '$agentExe' -register -clear 2>&1",
            "Write-Host ""-register -clear exit: `$LASTEXITCODE""",
            "",
            "Remove-Item 'C:\ProgramData\Amazon\SSM\InstanceData\registration' -Force -ErrorAction SilentlyContinue",
            "Remove-Item 'C:\ProgramData\Amazon\SSM\InstanceData\Vault\Store' -Recurse -Force -ErrorAction SilentlyContinue",
            "",
            "Write-Host 'Registering with hybrid activation...'",
            "& '$agentExe' -register -code '{{Param.ActivationCode}}' -id '{{Param.ActivationId}}' -region '{{Param.AWS_REGION}}' 2>&1",
            "`$regExit = `$LASTEXITCODE",
            "Write-Host ""-register exit: `$regExit""",
            "if (`$regExit -ne 0) { exit `$regExit }",
            "",
            "# Best-effort: if service still exists, ensure it's auto-starting.",
            "`$svc = Get-Service -Name AmazonSSMAgent -ErrorAction SilentlyContinue",
            "if (`$svc) {",
            "    Set-Service   -Name AmazonSSMAgent -StartupType Automatic",
            "    Start-Service -Name AmazonSSMAgent",
            "    Write-Host ""Service status: `$((Get-Service AmazonSSMAgent).Status)""",
            "} else {",
            "    Write-Host 'AmazonSSMAgent service not present - caller will reinstall it.'",
            "}",
            "",
            "exit 0"
        )
        $regLines -join "`r`n" | Set-Content -Path $regScript -Encoding UTF8
        Write-Host "Staged registration script: $regScript"

        Write-Host ''
        Write-Host 'Running clear + register + service start as SYSTEM...'
        $result = Invoke-ElevatedScript -ScriptPath $regScript -TimeoutSec 240
        if ($result.ExitCode -ne 0) {
            throw "Elevated registration script failed with exit code $($result.ExitCode)"
        }
        Write-Host 'Registration flow complete.'

        # ------------------------------------------------------------------
        # Extract mi-* ID from the elevated task output captured in memory
        # (avoids Select-String encoding issues with the on-disk log file).
        # amazon-ssm-agent prints:
        #   "Successfully registered the instance with AWS SSM using Managed
        #    instance-id: mi-...".
        # ------------------------------------------------------------------
        # Strip any null bytes that may have bled in from mixed-encoding
        # capture, so regex works consistently on the visible text.
        $cleanLog = $result.Log -replace "`0", ''
        Write-Host ("cleanLog length: {0} chars" -f $cleanLog.Length)

        # Now that the wrapper's log is decoded as UTF-16 (Unicode), regex
        # directly against the in-memory string.
        $managedNodeId = $null
        # Regex with '+' quantifier; curly-brace quantifiers can collide with
        # OpenJD template substitution in the bundle build step.
        $m = [regex]::Match($cleanLog, 'mi-[a-fA-F0-9]+')
        if ($m.Success) { $managedNodeId = $m.Value }

        # DEBUG: show char codes around the expected match text so we can
        # confirm there are no hidden null bytes or surrogate pairs.
        if (-not $managedNodeId) {
            $idx = $result.Log.IndexOf('instance-id')
            if ($idx -ge 0) {
                $slice = $result.Log.Substring($idx, [Math]::Min(80, $result.Log.Length - $idx))
                Write-Host "DEBUG: text around 'instance-id' (literal): [$slice]"
                $codes = ($slice.ToCharArray() | ForEach-Object { [int]$_ }) -join ','
                Write-Host "DEBUG: char codes: $codes"
            } else {
                Write-Host "DEBUG: 'instance-id' substring not found in result.Log at all."
            }
        }

        # Fallback: read the registration JSON as SYSTEM. Only runs if the
        # primary regex against the agent stdout somehow didn't match.
        if (-not $managedNodeId) {
            Write-Host 'WARN: regex did not match agent stdout; reading registration file as SYSTEM...'
            $readScript = Join-Path $elevatedDir 'read-registration.ps1'
            "Get-Content -Raw 'C:\ProgramData\Amazon\SSM\InstanceData\registration' -ErrorAction SilentlyContinue" |
                Set-Content -Path $readScript -Encoding UTF8
            $r = Invoke-ElevatedScript -ScriptPath $readScript -TimeoutSec 30
            $m = [regex]::Match(($r.Log -replace "`0", ''), 'mi-[a-fA-F0-9]+')
            if ($m.Success) { $managedNodeId = $m.Value }
        }

        if (-not $managedNodeId) {
            throw "Could not extract mi-<hex> ID from elevated output or registration file."
        }
        Write-Host ("Extracted managed node ID: {0}" -f $managedNodeId)

        # If the registration dropped the Windows service (some -register
        # codepaths uninstall it), reinstall it pointing at the existing exe.
        $needsServiceInstall = $null -eq (Get-Service -Name AmazonSSMAgent -ErrorAction SilentlyContinue)
        if ($needsServiceInstall) {
            Write-Host 'AmazonSSMAgent service missing after -register; reinstalling...'
            $installScript = Join-Path $elevatedDir 'install-service.ps1'
            @(
                "`$ErrorActionPreference = 'Continue'",
                "& sc.exe create AmazonSSMAgent binPath= '""$agentExe""' start= auto displayname= 'Amazon SSM Agent' 2>&1",
                "Write-Host ""sc create exit: `$LASTEXITCODE""",
                "Start-Service -Name AmazonSSMAgent",
                "`$svc = Get-Service -Name AmazonSSMAgent",
                "Write-Host ""Service status: `$(`$svc.Status)""",
                "exit 0"
            ) -join "`r`n" | Set-Content -Path $installScript -Encoding UTF8
            $r = Invoke-ElevatedScript -ScriptPath $installScript -TimeoutSec 60
            if ($r.ExitCode -ne 0) {
                throw "Service reinstall failed with exit code $($r.ExitCode)"
            }
        }

        Write-Host ''
        Write-Host '=============================================='
        Write-Host "SSM Managed Node ID: $managedNodeId"
        Write-Host '=============================================='
        Write-Host ''
        Write-Host 'Connect with:'
        Write-Host "  aws ssm start-session --target $managedNodeId --region {{Param.AWS_REGION}}"
        Write-Host 'RDP port-forward:'
        Write-Host "  aws ssm start-session --target $managedNodeId --region {{Param.AWS_REGION}} ``"
        Write-Host '    --document-name AWS-StartPortForwardingSession ``'
        Write-Host '    --parameters ''{"portNumber":["3389"],"localPortNumber":["13389"]}'''
        Write-Host '  Then: mstsc /v:localhost:13389'
        Write-Host ''

        # ------------------------------------------------------------------
        # Keep-alive loop. Checks the agent is still Running each minute.
        # Self-heal restart goes through the elevated helper because the
        # agent service's DACL rejects job-user's filtered token.
        # ------------------------------------------------------------------
        $totalSeconds = {{Param.SessionMinutes}} * 60
        $interval     = 60
        $elapsed      = 0
        Write-Host "Keeping session alive for {{Param.SessionMinutes}} minutes..."
        Write-Host ''

        $restartScript = Join-Path $elevatedDir 'restart-agent.ps1'
        @(
            "`$ErrorActionPreference = 'Continue'",
            "Start-Service -Name AmazonSSMAgent",
            "exit 0"
        ) -join "`r`n" | Set-Content -Path $restartScript -Encoding UTF8

        while ($elapsed -lt $totalSeconds) {
            Start-Sleep -Seconds $interval
            $elapsed  += $interval
            $remaining = [math]::Floor(($totalSeconds - $elapsed) / 60)
            $now       = Get-Date
            Write-Host "[$now] SSM node $managedNodeId active. ${remaining}m remaining."

            $svc = Get-Service -Name AmazonSSMAgent -ErrorAction SilentlyContinue
            if ($null -eq $svc -or $svc.Status -ne 'Running') {
                Write-Host "WARNING: AmazonSSMAgent is not Running (state: $($svc.Status)); restarting via elevated task..."
                try {
                    Invoke-ElevatedScript -ScriptPath $restartScript -TimeoutSec 60 | Out-Null
                } catch {
                    Write-Host "Failed to restart: $_"
                }
            }
        }

        # ------------------------------------------------------------------
        # Cleanup / Deregister (best-effort; do not fail the job).
        # ------------------------------------------------------------------
        Write-Host ''
        Write-Host 'Session ended. Deregistering managed node...'
        $cleanupScript = Join-Path $elevatedDir 'cleanup.ps1'
        @(
            "`$ErrorActionPreference = 'Continue'",
            "& '$agentExe' -register -clear 2>&1",
            "Stop-Service -Name AmazonSSMAgent -Force -ErrorAction SilentlyContinue",
            "exit 0"
        ) -join "`r`n" | Set-Content -Path $cleanupScript -Encoding UTF8
        try {
            $code = Invoke-ElevatedScript -ScriptPath $cleanupScript -TimeoutSec 120
            Write-Host "Cleanup script exit: $code"
        } catch {
            Write-Host "WARNING: cleanup step failed: $_"
        }
        Write-Host 'Cleanup complete.'
        Write-Host '=============================================='
        Write-Host 'SSM Managed Node session ended.'
        Write-Host '=============================================='
