specificationVersion: jobtemplate-2023-09
extensions: [FEATURE_BUNDLE_1, EXPR]
name: "POV-Ray 3.7 Render Job"
description: "POV-Ray raytracing render job template with configurable parameters"

parameterDefinitions:
  - name: InputScene
    type: path
    objectType: FILE
    dataFlow: IN
    default: "sample/sample.pov"
    userInterface:
      control: CHOOSE_INPUT_FILE
      label: Vray Scene File
      groupLabel: Render Parameters
      fileFilters:
      - label: POV-Ray Scene File
        patterns: ["*.pov"]
      - label: All Files
        patterns: ["*"]
    description: "Input POV-Ray scene file (.pov)"
    
  - name: OutputFilename
    type: path
    objectType: FILE
    dataFlow: OUT
    default: "render"
    userInterface:
      control: CHOOSE_OUTPUT_FILE
      label: Output File
      groupLabel: Render Parameters
    description: "Output filename (without extension)"
    
  - name: ImageWidth
    type: int
    default: 800
    userInterface:
      control: SPIN_BOX
      label: Image Width
      groupLabel: Render Parameters
    description: "Image width in pixels"
    
  - name: ImageHeight
    type: int
    default: 600
    userInterface:
      control: SPIN_BOX
      label: Image Height
      groupLabel: Render Parameters
    description: "Image height in pixels"
    
  - name: Quality
    type: int
    default: 9
    minValue: 0
    maxValue: 11
    userInterface:
      control: SPIN_BOX
      label: Render Quality
      groupLabel: Render Parameters
    description: "Render quality (0-11, higher is better)"
    
  - name: Antialiasing
    type: float
    default: 0.3
    minValue: 0.0
    maxValue: 1.0
    userInterface:
      control: SPIN_BOX
      label: Antialiasing
      groupLabel: Render Parameters
    description: "Antialiasing threshold (0.0-1.0)"
    
  - name: CondaPackages
    type: string
    default: "povray"
    userInterface:
      control: LINE_EDIT
      label: Conda Packages
      groupLabel: Software Environment
    description: "Conda packages to install"

  - name: CondaChannels
    type: string
    default: "conda-forge"
    userInterface:
      control: LINE_EDIT
      label: Conda Channels
      groupLabel: Software Environment
    description: "This is a space-separated list of Conda channels from which to install packages. POV-Ray is available on Conda Forge so we override the channels list"
  

steps:
  - name: PovrayRender
    description: "Render POV-Ray scene"
    bash:
      let:
        - output_file = Param.OutputFilename + '.png'
      script: |
        set -euo pipefail
        
        echo "Starting POV-Ray render..."
        echo "Input scene:" {{ repr_sh(Param.InputScene) }}
        echo "Output file:" {{ repr_sh(output_file) }}
        echo "Resolution: {{ Param.ImageWidth }}x{{ Param.ImageHeight }}"
        echo "Quality: {{ Param.Quality }}"
        echo "Antialiasing: {{ Param.Antialiasing }}"
        
        # Check if input scene exists
        if [[ ! -f {{ repr_sh(Param.InputScene) }} ]]; then
            echo "Error: Input scene file not found:" {{ repr_sh(Param.InputScene) }}
            exit 1
        fi
        
        echo "Rendering to:" {{ repr_sh(output_file) }}
        
        # Run POV-Ray render
        povray \
          +I{{ repr_sh(Param.InputScene) }} \
          +O{{ repr_sh(output_file) }} \
          +W{{ Param.ImageWidth }} \
          +H{{ Param.ImageHeight }} \
          +FN \
          +Q{{ Param.Quality }} \
          +A{{ Param.Antialiasing }} \
          +V \
          -D
        
        # Check if render was successful
        if [[ -f {{ repr_sh(output_file) }} ]]; then
            echo "Render completed successfully:" {{ repr_sh(output_file) }}
            file {{ repr_sh(output_file) }} || echo "File info not available"
        else
            echo "Error: Render failed - output file not created"
            exit 1
        fi
        
        echo "POV-Ray render job completed."
