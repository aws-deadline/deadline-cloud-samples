specificationVersion: 'jobtemplate-2023-09'
name: List Available Conda Packages

parameterDefinitions:
- name: CondaChannel
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Conda Channel
  description: "The conda channel to search for packages."
  default: "deadline-cloud"
steps:
- name: ListPackages
  script:
    actions:
      onRun:
        command: bash
        args: ['{{Task.File.Run}}']
    embeddedFiles:
    - name: Run
      type: TEXT
      runnable: true
      data: |
        #!/usr/bin/env bash

        set -euxo pipefail

        conda search -c '{{Param.CondaChannel}}' '*'
