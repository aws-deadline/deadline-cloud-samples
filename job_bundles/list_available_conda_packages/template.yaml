specificationVersion: jobtemplate-2023-09
extensions: [FEATURE_BUNDLE_1, EXPR]
name: List Available Conda Packages

parameterDefinitions:
- name: CondaChannel
  type: string
  default: deadline-cloud
  userInterface:
    control: LINE_EDIT
    label: Conda Channel
  description: The conda channel to search for packages.

steps:
- name: ListPackages
  bash:
    script: |
      set -euxo pipefail
      conda search -c {{ repr_sh(Param.CondaChannel) }} '*'
