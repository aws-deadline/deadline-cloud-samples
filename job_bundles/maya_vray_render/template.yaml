specificationVersion: 'jobtemplate-2023-09'
name: Maya V-Ray Render
description: |
  This job bundle renders a Maya scene with the V-Ray renderer using the
  Maya CLI `Render` command.

  To run it, you will need Maya and V-Ray available in the PATH in one of the following ways:
    * As conda packages when your queue has a conda queue environment set up to
      provide virtual environments for jobs. The `maya-vray` package provides the
      vrayformaya plugin as a Maya module.
    * Installed on the worker hosts that run the job. You can customize your Deadline Cloud
      queue, fleets, and this job to fit your own production pipeline.

  V-Ray renders on CPU by default and requires a license. See the embedded README.md for
  more information about this job, its default scene file, and its licensing requirements.

parameterDefinitions:

# Render Parameters
- name: MayaSceneFile
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: Maya Scene File
    groupLabel: Render Parameters
    fileFilters:
    - label: Maya Scene Files
      patterns: ["*.ma", "*.mb"]
    - label: All Files
      patterns: ["*"]
  description: >
    Choose the Maya scene file you want to render with V-Ray.

    The scene must select V-Ray as its renderer. A scene that contains V-Ray
    nodes records a `requires "vrayformaya"` statement, which makes Maya load the
    plugin when it reads the scene.

    Use the 'Job Attachments' tab of the submitter GUI to add textures
    and other files that the job needs.
  default: vray_spheres.ma
- name: Frames
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Frames
    groupLabel: Render Parameters
  default: "1"
- name: CameraName
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Camera Name
    groupLabel: Render Parameters
  default: renderCamera
- name: ImageWidth
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Image Width
    groupLabel: Render Parameters
  default: 960
- name: ImageHeight
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Image Height
    groupLabel: Render Parameters
  default: 540
- name: OutputDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: OUT
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Output Directory
    groupLabel: Render Parameters
  description: Choose the render output directory.
  default: output
- name: ProjectPath
  type: PATH
  objectType: DIRECTORY
  dataFlow: IN
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Project Path
    groupLabel: Render Parameters
  description: Choose the Maya project directory.
  default: "."

# Software Environment
- name: CondaPackages
  type: STRING
  userInterface:
    # This parameter is for a queue environment, not used directly in the job,
    # so leave the GUI for the queue environment to display.
    control: HIDDEN
  description: Choose which conda packages to install for the render. Requires a conda queue environment to process the value.
  default: maya maya-vray openimageio
- name: CondaChannels
  type: STRING
  userInterface:
    # This parameter is for a queue environment, not used directly in the job,
    # so leave the GUI for the queue environment to display.
    control: HIDDEN
  description: >
    Choose which conda channels to install packages from. Requires a conda queue
    environment to process the value. Maya 2027 is only on the "deadline-cloud-v2"
    channel, and openimageio comes from the conda-forge community channel. Add the
    channel hosting your own maya-vray package to this list.
  default: deadline-cloud-v2 deadline-cloud conda-forge

steps:

- name: Render
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: "{{Param.Frames}}"
  script:
    embeddedFiles:
    - name: Render
      filename: render.sh
      type: TEXT
      data: |
        set -euo pipefail

        cd '{{Param.ProjectPath}}'

        set -x
        # The V-Ray renderer accepts a different set of flags than the Maya software
        # renderer. Notably it rejects -fnc with "Invalid flag". Run
        # `Render -r vray -help` to list the flags it supports.
        Render -r vray \
            -proj '{{Param.ProjectPath}}' \
            -rd '{{Param.OutputDir}}' \
            -s {{Task.Param.Frame}} \
            -e {{Task.Param.Frame}} \
            -pad 4 \
            -cam '{{Param.CameraName}}' \
            -x {{Param.ImageWidth}} \
            -y {{Param.ImageHeight}} \
            '{{Param.MayaSceneFile}}'

        # Also write a PNG next to each rendered EXR so you can check the result without
        # an EXR viewer. oiiotool comes from the openimageio conda package. If the scene
        # is set to write a format other than EXR, there is nothing to convert.
        shopt -s nullglob
        for RENDERED in '{{Param.OutputDir}}'/*.exr; do
            oiiotool "$RENDERED" --colorconvert linear sRGB -o "${RENDERED%.exr}.png"
        done
    actions:
      onRun:
        command: bash
        args: ["{{Task.File.Render}}"]
        cancelation:
          mode: NOTIFY_THEN_TERMINATE
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - linux
