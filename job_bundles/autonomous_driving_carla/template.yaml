specificationVersion: jobtemplate-2023-09
name: CARLA Simulation Demo
description: |
  Run a driving scenario parameter sweep with configurable camera viewpoints.
  Combines Phase 2 (parameter sweep across ego speed, NPC speed, NPC distance)
  with Phase 3 (multi-sensor capture with selectable camera viewpoints).
  Each parameter combination runs as a parallel task, capturing RGB frames
  from the selected cameras and producing per-task videos.

parameterDefinitions:
  # --- Scenario Settings ---
  - name: ScenarioType
    type: STRING
    default: "Lane Change Cut-In (change_lane.osc)"
    description: "The scenario being executed. NPC overtakes ego and cuts into ego's lane."
    userInterface:
      control: LINE_EDIT
      label: Scenario
      groupLabel: Scenario Settings
  - name: CarlaBootTown
    type: STRING
    default: "Town04"
    allowedValues: ["Town04", "Town10HD_Opt"]
    description: |
      Town to run the scenario in. Must match the scenario file's set_map().
      Town04: multi-lane highway (lane change, overtake, cut-in scenarios).
    userInterface:
      control: DROPDOWN_LIST
      label: Town Map
      groupLabel: Scenario Settings

  - name: EgoSpeeds
    type: STRING
    default: "20,40"
    description: "Ego vehicle speeds (kph), comma-separated."
    userInterface:
      control: LINE_EDIT
      label: Ego Speeds (kph)
      groupLabel: Scenario Settings

  - name: NpcSpeeds
    type: STRING
    default: "30,50"
    description: "NPC vehicle speeds (kph), comma-separated."
    userInterface:
      control: LINE_EDIT
      label: NPC Speeds (kph)
      groupLabel: Scenario Settings

  - name: NpcDistances
    type: STRING
    default: "10,15"
    description: "NPC starting distances (m), comma-separated."
    userInterface:
      control: LINE_EDIT
      label: NPC Distances (m)
      groupLabel: Scenario Settings

  # --- Camera Viewpoints ---
  - name: CamFront
    type: STRING
    default: "True"
    allowedValues: ["True", "False"]
    description: Forward-facing dashcam view
    userInterface:
      control: CHECK_BOX
      label: Front
      groupLabel: Camera Viewpoints

  - name: CamFrontLeft
    type: STRING
    default: "False"
    allowedValues: ["True", "False"]
    description: Front-left 60° view
    userInterface:
      control: CHECK_BOX
      label: Front Left
      groupLabel: Camera Viewpoints

  - name: CamFrontRight
    type: STRING
    default: "False"
    allowedValues: ["True", "False"]
    description: Front-right 60° view
    userInterface:
      control: CHECK_BOX
      label: Front Right
      groupLabel: Camera Viewpoints

  - name: CamRear
    type: STRING
    default: "False"
    allowedValues: ["True", "False"]
    description: Rear-facing view
    userInterface:
      control: CHECK_BOX
      label: Rear
      groupLabel: Camera Viewpoints

  - name: CamRearLeft
    type: STRING
    default: "False"
    allowedValues: ["True", "False"]
    description: Rear-left 120° view
    userInterface:
      control: CHECK_BOX
      label: Rear Left
      groupLabel: Camera Viewpoints

  - name: CamRearRight
    type: STRING
    default: "False"
    allowedValues: ["True", "False"]
    description: Rear-right 120° view
    userInterface:
      control: CHECK_BOX
      label: Rear Right
      groupLabel: Camera Viewpoints

  # --- Output ---
  - name: OutputDir
    type: PATH
    objectType: DIRECTORY
    dataFlow: OUT
    description: Root output directory (each task writes to a subdirectory)
    userInterface:
      control: CHOOSE_DIRECTORY
      label: Output Directory
      groupLabel: Output

  # --- Advanced ---
  - name: ImageURI
    type: STRING
    description: ECR URI of the CARLA Phase 3 multi-sensor image
    default: "<ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/carla-deadline-poc:0.9.16-phase3-v2"
    userInterface:
      control: LINE_EDIT
      label: Container Image URI
      groupLabel: Advanced

  - name: AwsRegion
    type: STRING
    default: "us-west-2"
    userInterface:
      control: LINE_EDIT
      label: AWS Region (for ECR login)
      groupLabel: Advanced

  - name: CarlaTimeoutSeconds
    type: INT
    default: 120
    minValue: 30
    maxValue: 600
    description: How long to wait for the CARLA server to come up before failing
    userInterface:
      control: SPIN_BOX
      label: CARLA Boot Timeout (seconds)
      groupLabel: Advanced

  - name: CondaPackages
    type: STRING
    default: "ffmpeg"
    description: Conda packages to install in the queue environment
    userInterface:
      control: LINE_EDIT
      label: Conda Packages
      groupLabel: Advanced

steps:
  - name: 1-RunScenario
    hostRequirements:
      amounts:
        - name: amount.worker.gpu
          min: 1
    parameterSpace:
      taskParameterDefinitions:
        - name: EgoSpeed
          type: INT
          range: "{{Param.EgoSpeeds}}"
        - name: NpcSpeed
          type: INT
          range: "{{Param.NpcSpeeds}}"
        - name: NpcDistance
          type: INT
          range: "{{Param.NpcDistances}}"
      combination: EgoSpeed * NpcSpeed * NpcDistance
    script:
      actions:
        onRun:
          command: bash
          args:
            - "{{Task.File.Run}}"
      embeddedFiles:
        - name: Run
          type: TEXT
          data: |
            set -euo pipefail

            EGO_SPEED="{{Task.Param.EgoSpeed}}"
            NPC_SPEED="{{Task.Param.NpcSpeed}}"
            NPC_DISTANCE="{{Task.Param.NpcDistance}}"
            OUTPUT_PATH="{{Param.OutputDir}}"
            TASK_NAME="ego${EGO_SPEED}_npc${NPC_SPEED}_dist${NPC_DISTANCE}"

            # Assemble camera list from checkboxes
            CAMERAS=""
            [[ "{{Param.CamFront}}" == "True" ]] && CAMERAS="${CAMERAS}front,"
            [[ "{{Param.CamFrontLeft}}" == "True" ]] && CAMERAS="${CAMERAS}front_left,"
            [[ "{{Param.CamFrontRight}}" == "True" ]] && CAMERAS="${CAMERAS}front_right,"
            [[ "{{Param.CamRear}}" == "True" ]] && CAMERAS="${CAMERAS}rear,"
            [[ "{{Param.CamRearLeft}}" == "True" ]] && CAMERAS="${CAMERAS}rear_left,"
            [[ "{{Param.CamRearRight}}" == "True" ]] && CAMERAS="${CAMERAS}rear_right,"
            CAMERAS="${CAMERAS%,}"  # trim trailing comma
            if [[ -z "$CAMERAS" ]]; then
                CAMERAS="front"  # fallback if nothing selected
            fi

            echo "=== CARLA Simulation Demo ==="
            echo "  EgoSpeed:    ${EGO_SPEED} kph"
            echo "  NpcSpeed:    ${NPC_SPEED} kph"
            echo "  NpcDistance: ${NPC_DISTANCE} m"
            echo "  Cameras:     ${CAMERAS}"
            echo "  Task name:   $TASK_NAME"

            # Locate template and data dir
            TEMPLATE=$(find /sessions -name "change_lane.osc.template" 2>/dev/null | head -1)
            if [[ -z "$TEMPLATE" ]]; then
                echo "ERROR: change_lane.osc.template not found"
                find /sessions -name "*.osc*" 2>/dev/null
                exit 1
            fi
            DATA_DIR=$(dirname "$TEMPLATE")
            echo "Template: $TEMPLATE"

            # Task-specific output dir
            TASK_OUTPUT="$OUTPUT_PATH/$TASK_NAME"
            mkdir -p "$TASK_OUTPUT"
            mkdir -p "$TASK_OUTPUT/video"
            echo "Task output: $TASK_OUTPUT"

            # Generate scenario from template
            export EGO_SPEED NPC_SPEED NPC_DISTANCE CARLA_BOOT_TOWN="{{Param.CarlaBootTown}}"
            envsubst '${EGO_SPEED} ${NPC_SPEED} ${NPC_DISTANCE} ${CARLA_BOOT_TOWN}' \
                < "$TEMPLATE" > "$DATA_DIR/change_lane_${TASK_NAME}.osc"
            SCENARIO_FILE="$DATA_DIR/change_lane_${TASK_NAME}.osc"
            echo ""
            echo "=== Generated scenario ==="
            cat "$SCENARIO_FILE"
            echo ""

            INPUT_DIR="$DATA_DIR"
            INPUT_FILE=$(basename "$SCENARIO_FILE")

            chmod -R a+rX "$INPUT_DIR"
            chmod -R a+rwX "$TASK_OUTPUT"

            ECR_HOST=$(echo "{{Param.ImageURI}}" | cut -d/ -f1)

            echo "=== ECR login ==="
            aws ecr get-login-password --region "{{Param.AwsRegion}}" \
                | docker login --username AWS --password-stdin "$ECR_HOST"

            echo ""
            echo "=== Pulling image: {{Param.ImageURI}} ==="
            time docker pull "{{Param.ImageURI}}"

            echo ""
            echo "=== Running CARLA: $TASK_NAME ==="
            time docker run --rm \
                --runtime=nvidia \
                --network host \
                --env NVIDIA_VISIBLE_DEVICES=all \
                --env NVIDIA_DRIVER_CAPABILITIES=all \
                -e CARLA_TIMEOUT_S={{Param.CarlaTimeoutSeconds}} \
                -e RELOAD_WORLD=false \
                -e CARLA_BOOT_TOWN="{{Param.CarlaBootTown}}" \
                -e CAMERAS="$CAMERAS" \
                -v "$INPUT_DIR:/inputs:ro" \
                -v "$TASK_OUTPUT:/outputs" \
                "{{Param.ImageURI}}" \
                "/inputs/$INPUT_FILE" \
                "/outputs"

            echo ""
            echo "=== Outputs for $TASK_NAME ==="
            ls -la "$TASK_OUTPUT"

            # Count frames per camera
            for CAM in $(echo "$CAMERAS" | tr ',' ' '); do
                CAM_COUNT=$(find "$TASK_OUTPUT/rgb/$CAM" -name "*.png" 2>/dev/null | wc -l)
                echo "  $CAM: $CAM_COUNT frames"
            done

            # Generate video for each selected camera
            VIDEO_DIR="$TASK_OUTPUT/video"
            for CAM in $(echo "$CAMERAS" | tr ',' ' '); do
                FRAMES_DIR="$TASK_OUTPUT/rgb/$CAM"
                FRAME_COUNT=$(find "$FRAMES_DIR" -name "*.png" 2>/dev/null | wc -l)
                if [[ "$FRAME_COUNT" -gt 0 ]]; then
                    echo ""
                    echo "=== Generating video from $CAM camera ($FRAME_COUNT frames) ==="
                    ffmpeg -y -framerate 24 -pattern_type glob \
                        -i "$FRAMES_DIR/frame_*.png" \
                        -c:v libx264 -pix_fmt yuv420p \
                        -movflags +faststart \
                        "$VIDEO_DIR/${CAM}_scenario.mp4"
                fi
            done

            # Generate stitched grid video if multiple cameras selected
            CAM_COUNT=$(echo "$CAMERAS" | tr ',' ' ' | wc -w)
            if [[ "$CAM_COUNT" -gt 1 ]]; then
                echo ""
                echo "=== Generating stitched grid video ($CAM_COUNT cameras) ==="

                # Build per-camera video inputs for the grid (use the already-generated mp4s)
                INPUTS=""
                FILTER=""
                IDX=0
                for CAM in $(echo "$CAMERAS" | tr ',' ' '); do
                    INPUTS="$INPUTS -i $VIDEO_DIR/${CAM}_scenario.mp4"
                    FILTER="${FILTER}[${IDX}:v]scale=640:360[v${IDX}];"
                    IDX=$((IDX + 1))
                done

                # Determine grid layout
                if [[ "$CAM_COUNT" -le 2 ]]; then
                    COLS=2
                elif [[ "$CAM_COUNT" -le 4 ]]; then
                    COLS=2
                else
                    COLS=3
                fi

                # Build xstack layout string
                LAYOUT=""
                STACK_INPUTS=""
                for ((i=0; i<CAM_COUNT; i++)); do
                    COL=$((i % COLS))
                    ROW=$((i / COLS))
                    if [[ -n "$LAYOUT" ]]; then LAYOUT="${LAYOUT}|"; fi
                    LAYOUT="${LAYOUT}$((COL*640))_$((ROW*360))"
                    STACK_INPUTS="${STACK_INPUTS}[v${i}]"
                done
                FILTER="${FILTER}${STACK_INPUTS}xstack=inputs=${CAM_COUNT}:layout=${LAYOUT}[out]"

                ffmpeg -y $INPUTS \
                    -filter_complex "$FILTER" \
                    -map "[out]" \
                    -c:v libx264 -pix_fmt yuv420p -movflags +faststart \
                    "$VIDEO_DIR/grid_scenario.mp4"
            fi

            ls -la "$VIDEO_DIR/"
