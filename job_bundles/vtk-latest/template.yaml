specificationVersion: jobtemplate-2023-09
extensions: [FEATURE_BUNDLE_1, EXPR]
name: VTK Visualization

parameterDefinitions:

# Input Parameters
- name: InputDir
  type: path
  objectType: DIRECTORY
  dataFlow: IN
  default: "./sample"
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Input Directory
    groupLabel: Input Parameters
  description: >
    Directory containing the VTK script and any additional required files.

- name: InputScript
  type: string
  default: "flow_simulation_visualization.py"
  userInterface:
    control: LINE_EDIT
    label: Input Script Filename
    groupLabel: Input Parameters
  description: >
    Name of the Python script to run (must be in the input directory).

# Output Parameters
- name: OutputDir
  type: path
  objectType: DIRECTORY
  dataFlow: OUT
  default: "./output"
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Output Directory
    groupLabel: Output Parameters
  description: >
    Directory where the visualization output will be saved.

- name: OutputFilename
  type: string
  default: "visualization.jpg"
  userInterface:
    control: LINE_EDIT
    label: Output Filename
    groupLabel: Output Parameters
  description: >
    Name of the output image file.

# Render Parameters
- name: Width
  type: int
  default: 1280
  userInterface:
    control: SPIN_BOX
    label: Image Width (pixels)
    groupLabel: Render Parameters
  description: >
    Width of the output image in pixels.

- name: Height
  type: int
  default: 720
  userInterface:
    control: SPIN_BOX
    label: Image Height (pixels)
    groupLabel: Render Parameters
  description: >
    Height of the output image in pixels.

# Software Parameters
- name: CondaPackages
  type: string
  default: "vtk numpy"
  userInterface:
    control: LINE_EDIT
    label: Conda Packages
    groupLabel: Software Parameters
  description: >
    Conda packages to install for the environment. Add any additional packages your script requires.
    These packages must be available in a channel made available by a Queue Environment. vtk and numpy are available in CondaForge

# Additional Script Parameters
- name: ExtraParams
  type: string
  default: ""
  userInterface:
    control: LINE_EDIT
    label: Additional Parameters
    groupLabel: Script Parameters
  description: >
    Additional parameters to pass to the script (in format: '--param1 value1 --param2 value2').

steps:
- name: RenderVTKVisualization
  bash:
    script: |
      set -xeuo pipefail
      
      # Display environment information
      echo "Current directory: $(pwd)"
      echo "Listing input directory content:"
      ls -la {{ repr_sh(Param.InputDir) }}
      
      # Make sure output directory exists
      mkdir -p {{ repr_sh(Param.OutputDir) }}
      
      # Check if the input script exists
      if [ ! -f {{ repr_sh(Param.InputDir / Param.InputScript) }} ]; then
        echo "ERROR: Script {{ Param.InputScript }} not found in the input directory!"
        exit 1
      fi
      
      # Run the VTK visualization script
      echo "Running VTK visualization script: {{ Param.InputScript }}"
      
      python {{ repr_sh(Param.InputDir / Param.InputScript) }} \
        --output {{ repr_sh(Param.OutputDir / Param.OutputFilename) }} \
        --width {{ Param.Width }} \
        --height {{ Param.Height }} \
        {{ Param.ExtraParams }}
      
      echo "Visualization complete. Results saved to" {{ repr_sh(Param.OutputDir / Param.OutputFilename) }}
      ls -la {{ repr_sh(Param.OutputDir) }}
      
      # Check if the output file was created
      if [ ! -f {{ repr_sh(Param.OutputDir / Param.OutputFilename) }} ]; then
        echo "WARNING: Output file {{ Param.OutputFilename }} was not found in the output directory!"
        echo "This might be expected if your script saves output with a different name or format."
      else
        echo "Output file successfully created:" {{ repr_sh(Param.OutputDir / Param.OutputFilename) }}
      fi
