specificationVersion: 'jobtemplate-2023-09'
name: Rez shim demo
description: |
  Demonstrates that a Rez-provided tool can be invoked by bare command name
  from a job template, with the Rez environment applied by the queue
  environment's PATH shims rather than by replaying captured variables.
parameterDefinitions:
  - name: ToolName
    type: STRING
    description: The Rez-provided command to invoke by bare name.
    default: "demorender"

steps:
- name: RunRezTool
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: "1-2"
  script:
    actions:
      onRun:
        command: "{{Param.ToolName}}"
        args: ["frame-{{Task.Param.Frame}}"]

- name: VerifyEnvironment
  dependencies:
  - dependsOn: RunRezTool
  script:
    actions:
      onRun:
        command: bash
        args: ["{{Task.File.Verify}}"]
    embeddedFiles:
    - name: Verify
      filename: verify.sh
      type: TEXT
      data: |
        set -uo pipefail

        echo "=== PATH ==="
        echo "$PATH" | tr ':' '\n' | head -3

        echo "=== Shim directory ==="
        echo "REZ_SHIM_DIR=${REZ_SHIM_DIR:-UNSET}"
        echo "REZ_CONTEXT_FILE=${REZ_CONTEXT_FILE:-UNSET}"
        ls -l "${REZ_SHIM_DIR:-/nonexistent}" || echo "no shim dir"

        echo "=== Which resolves to a shim ==="
        command -v "${1:-demorender}" || true

        # The tool's own environment variables must be visible INSIDE the tool's
        # process, supplied by Rez, even though they were never exported into the
        # session via openjd_env.
        echo "=== DEMOTOOL_VERSION as seen by the session (expected UNSET) ==="
        echo "DEMOTOOL_VERSION=${DEMOTOOL_VERSION:-UNSET}"

        echo "=== DEMOTOOL_VERSION as seen inside the tool (expected 1.0.0) ==="
        demorender check-env

        # The three checks below are the point of the sample. Each one passes
        # with the shim environment and fails with an environment that harvests
        # variables from a subshell and replays them.
        FAILURES=0

        # Capture output into a variable before matching. Piping directly into
        # `grep -q` makes grep exit at the first match, which closes the pipe and
        # kills the writer with SIGPIPE (exit 141); under `pipefail` that reads
        # as a failed check even though the output was correct.
        echo "=== Check 1: plain variable reaches the tool ==="
        tool_out="$(demorender check-env)"
        if printf '%s\n' "$tool_out" | grep -q "DEMOTOOL_VERSION=1.0.0"; then
            echo "PASS: variable visible inside the tool"
        else
            echo "FAIL: variable missing inside the tool"
            FAILURES=$((FAILURES + 1))
        fi

        # An `alias` in a Rez package becomes an exported shell function. Bash
        # exports it as BASH_FUNC_demoalias%%, a name containing '%%' with a
        # multiline value, which openjd_env cannot express. Replaying captured
        # variables therefore drops it.
        echo "=== Check 2: Rez alias survives into the task ==="
        alias_out="$(rez env --input "$REZ_CONTEXT_FILE" --shell bash -- bash -c 'demoalias' 2>/dev/null || true)"
        if printf '%s\n' "$alias_out" | grep -q "via-alias"; then
            echo "PASS: alias is callable"
        else
            echo "FAIL: alias was lost"
            FAILURES=$((FAILURES + 1))
        fi

        # demotool provides its own `sort` and prepends its bin directory to
        # PATH, so inside a correctly applied context it must shadow the system
        # binary. This checks ordered PATH edits, not just PATH's contents.
        echo "=== Check 3: package PATH prepend shadows the system command ==="
        if demosort_out="$(rez env --input "$REZ_CONTEXT_FILE" --shell bash -- sort --help 2>/dev/null)" \
            && echo "$demosort_out" | grep -q "demotool's sort"; then
            echo "PASS: package command shadows the system one"
        else
            echo "FAIL: system command won, PATH order was not preserved"
            FAILURES=$((FAILURES + 1))
        fi

        echo "=== Result ==="
        if [ "$FAILURES" -ne 0 ]; then
            echo "openjd_fail: $FAILURES of 3 environment fidelity checks failed."
            exit 1
        fi
        echo "All 3 environment fidelity checks passed."
