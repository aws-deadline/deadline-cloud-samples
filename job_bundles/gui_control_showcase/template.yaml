specificationVersion: jobtemplate-2023-09
extensions: [FEATURE_BUNDLE_1, EXPR]
name: GUI Control Showcase

parameterDefinitions:
# Text Controls
  - name: LineEditControl
    type: string
    default: Default line edit value.
    userInterface:
      control: LINE_EDIT
      label: Line Edit Control
      groupLabel: Text Controls
    description: Unrestricted line of text!
  - name: MultiLineEditControl
    type: string
    default: |
      This is a
      text file with
      multiple lines.
    userInterface:
      control: MULTILINE_EDIT
      label: Multi-line Edit Control
      groupLabel: Text Controls
    description: Unrestricted text file
  - name: StringDropdown
    type: string
    default: WEDNESDAY
    allowedValues: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
    userInterface:
      control: DROPDOWN_LIST
      label: String Dropdown
      groupLabel: Text Controls
    description: A dropdown with string values.
  - name: CheckBox
    type: bool
    default: true
    userInterface:
      control: CHECK_BOX
      label: Check Box
      groupLabel: Text Controls
    description: Set a true/false value.
# Int Controls
  - name: IntSpinner
    type: int
    default: 42
    userInterface:
      control: SPIN_BOX
      label: Default Int Spinner
      groupLabel: Int Controls
    description: A default integer spinner.
  - name: BigStepIntSpinner
    type: int
    default: 123
    userInterface:
      control: SPIN_BOX
      label: Big Step Int Spinner
      groupLabel: Int Controls
      singleStepDelta: 30
    description: A default integer spinner.
  - name: BoundedIntSpinner
    type: int
    default: 25
    minValue: -100
    maxValue: 100
    userInterface:
      control: SPIN_BOX
      label: Bounded Int Spinner
      groupLabel: Int Controls
    description: A bounded integer spin box.
  - name: IntDropdown
    type: int
    default: 7
    allowedValues: [3, 8, 7, 2, 9, 1]
    userInterface:
      control: DROPDOWN_LIST
      label: Int Dropdown
      groupLabel: Dropdown Controls
    description: A dropdown with integer values.
  - name: HiddenFieldOne
    type: int
    default: 10
    userInterface:
      control: HIDDEN
    description: A hidden field that won't show on the UI
# Float Controls
  - name: FloatSpinner
    type: float
    default: 1234.56789
    userInterface:
      control: SPIN_BOX
      label: Default Float Spinner
      groupLabel: Float Controls
    description: A default float spinner.
  - name: FloatSpinnerOneDecimal
    type: float
    default: 100000.01
    userInterface:
      control: SPIN_BOX
      label: Float Spinner One Decimal
      groupLabel: Float Controls
      decimals: 1
    description: A float spinner with one decimal of precision.
  - name: FloatSpinnerFixedStep
    type: float
    default: 0.0
    userInterface:
      control: SPIN_BOX
      label: Float Spinner Fixed Step
      groupLabel: Float Controls
      singleStepDelta: 0.875
    description: A float spinner with a fixed step of .875
  - name: FloatDropdown
    type: float
    default: 3.26
    allowedValues: [1.23, 3.26, 9.9, 1.2345]
    userInterface:
      control: DROPDOWN_LIST
      label: Float Dropdown
      groupLabel: Dropdown Controls
    description: A dropdown with floating point values.
# Path Controls
  - name: InputFilePicker
    type: path
    objectType: FILE
    dataFlow: IN
    userInterface:
      control: CHOOSE_INPUT_FILE
      label: Input File Picker
      groupLabel: Path Controls
      fileFilters:
      - label: Scene Files
        patterns: ["*.blend", "*.mb", "*.ma", "*.nk"]
      - label: Any Files
        patterns: ["*"]
    description: Choose the input scene file.
  - name: OutputFilePicker
    type: path
    objectType: FILE
    dataFlow: OUT
    userInterface:
      control: CHOOSE_OUTPUT_FILE
      label: Output File Picker
      groupLabel: Path Controls
      fileFilters:
      - label: EXR Files
        patterns: ["*.exr"]
      - label: JPEG Files
        patterns: ["*.jpg", "*.jpeg"]
      - label: PNG Files
        patterns: ["*.png"]
      - label: All Files
        patterns: ["*"]
    description: Choose the output image file.
  - name: DirectoryPicker
    type: path
    objectType: DIRECTORY
    dataFlow: INOUT
    userInterface:
      control: CHOOSE_DIRECTORY
      label: Directory Picker
      groupLabel: Path Controls
    description: Choose a directory.
  - name: HiddenFieldTwo
    type: path
    default: relative/path/inside/job/bundle
    userInterface:
      control: HIDDEN
      label: This won't show
    description: A hidden field that won't show on the UI
# EXPR Extension Features
  - name: FrameRange
    type: range_expr
    default: "1-10,15,20-25"
    userInterface:
      control: LINE_EDIT
      label: Frame Range (range_expr type)
      groupLabel: EXPR Extension Features
    description: A range expression for frame numbers. Supports ranges like "1-10", lists like "1,5,10", and combinations.
  - name: VerboseOutput
    type: bool
    default: false
    userInterface:
      control: CHECK_BOX
      label: Verbose Output
      groupLabel: EXPR Extension Features
    description: Enable verbose output to demonstrate conditional args.

steps:
- name: PrintAllTheValues
  # Demonstrate let bindings at step level
  let:
    - frame_count = len(Param.FrameRange)
    - first_frame = min(Param.FrameRange)
    - last_frame = max(Param.FrameRange)
  script:
    # Demonstrate let bindings at script level. These are evaluated on the worker host,
    # so they can use PATH parameters, which are only available after path mapping.
    let:
      - input_stem = Param.InputFilePicker.stem if Param.InputFilePicker != path('') else 'no_input'
    actions:
      onRun:
        command: bash
        # Demonstrate conditional args with null for omission and list flattening
        args:
          - '{{ Task.File.Run }}'
          - "{{ '--verbose' if Param.VerboseOutput else null }}"
          - "{{ ['--frame-count', string(frame_count)] if frame_count > 0 else null }}"
    embeddedFiles:
      - name: TextToPrint
        type: TEXT
        data: |
          === Basic Parameter Types ===

          LineEditControl value:
            {{ Param.LineEditControl }}

          MultiLineEditControl value:
            {{ Param.MultiLineEditControl }}

          StringDropdown value:
            {{ Param.StringDropdown }}

          CheckBox value (bool type):
            {{ Param.CheckBox }}


          IntSpinner value:
            {{ Param.IntSpinner }}

          BigStepIntSpinner value:
            {{ Param.BigStepIntSpinner }}

          BoundedIntSpinner value:
            {{ Param.BoundedIntSpinner }}

          IntDropdown value:
            {{ Param.IntDropdown }}

          HiddenFieldOne value:
            {{ Param.HiddenFieldOne }}


          FloatSpinner value:
            {{ Param.FloatSpinner }}

          FloatSpinnerOneDecimal value:
            {{ Param.FloatSpinnerOneDecimal }}

          FloatSpinnerFixedStep value:
            {{ Param.FloatSpinnerFixedStep }}

          FloatDropdown value:
            {{ Param.FloatDropdown }}


          InputFilePicker raw value:
            {{ RawParam.InputFilePicker }}
          InputFilePicker value mapped locally:
            {{ Param.InputFilePicker }}

          OutputFilePicker raw value:
            {{ RawParam.OutputFilePicker }}
          OutputFilePicker value mapped locally:
            {{ Param.OutputFilePicker }}

          DirectoryPicker raw value:
            {{ RawParam.DirectoryPicker }}
          DirectoryPicker value mapped locally:
            {{ Param.DirectoryPicker }}

          HiddenFieldTwo raw value:
            {{ RawParam.HiddenFieldTwo }}
          HiddenFieldTwo value mapped locally:
            {{ Param.HiddenFieldTwo }}

          === EXPR Extension Features ===

          FrameRange (range_expr type):
            Raw value: {{ Param.FrameRange }}
            As list: {{ list(Param.FrameRange) }}
            Frame count (using let binding): {{ frame_count }}
            First frame (using let binding): {{ first_frame }}
            Last frame (using let binding): {{ last_frame }}
            Sum of all frames: {{ sum(Param.FrameRange) }}

          Path operations on InputFilePicker:
            .name (filename): {{ Param.InputFilePicker.name if Param.InputFilePicker != path('') else 'N/A' }}
            .stem (without extension): {{ input_stem }}
            .suffix (extension): {{ Param.InputFilePicker.suffix if Param.InputFilePicker != path('') else 'N/A' }}
            .parent (directory): {{ Param.InputFilePicker.parent if Param.InputFilePicker != path('') else 'N/A' }}

          Conditional expression example:
            Day type: {{ 'Weekend' if Param.StringDropdown == 'SATURDAY' or Param.StringDropdown == 'SUNDAY' else 'Weekday' }}

          Arithmetic expression example:
            IntSpinner doubled: {{ Param.IntSpinner * 2 }}
            FloatSpinner rounded: {{ round(Param.FloatSpinner, 2) }}

          VerboseOutput (demonstrates conditional args):
            {{ Param.VerboseOutput }}
      - name: Run
        type: TEXT
        data: |
          echo "=== Command line arguments received ==="
          echo "Args: $@"
          echo ""
          cat {{ repr_sh(Task.File.TextToPrint) }}
