specificationVersion: jobtemplate-2023-09
extensions: [FEATURE_BUNDLE_1, EXPR]
name: "Job Attachments Explorer: Output"
description: |
  This bundle serves as the starting point for the exploration of how job attachments
  collects output files that is contained in job_bundles/Using_Files_In_Jobs.md.
parameterDefinitions:
- name: ScriptFile
  type: path
  default: script.sh
  dataFlow: IN
  objectType: FILE
- name: OutputDir
  type: path
  objectType: DIRECTORY
  dataFlow: OUT
  default: ./output_dir
  description: Output directory for all steps.
steps:
- name: Step
  script:
    actions:
      onRun:
        command: bash
        args: ['{{ Param.ScriptFile }}', '{{ Param.OutputDir }}', '{{ Session.PathMappingRulesFile }}']
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf: [linux]
