specificationVersion: 'jobtemplate-2023-09'
name: V-Ray Region Render

parameterDefinitions:

# Script Files
- name: RenderRegionScript
  type: PATH
  default: scripts/render_region.sh
  dataFlow: IN
  objectType: FILE
- name: MergeRegionsScript
  type: PATH
  default: scripts/merge_regions.sh
  dataFlow: IN
  objectType: FILE
- name: SetupVrayPathMappingScript
  type: PATH
  default: scripts/setup_vray_path_mapping.py
  dataFlow: IN
  objectType: FILE

# Render Parameters: V-Ray scene, output location, and image dimensions
- name: VraySceneFile
  type: PATH
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: Vray Scene File
    groupLabel: Render Parameters
    fileFilters:
    - label: Vray Scene Files
      patterns: ["*.vrscene"]
    - label: All Files
      patterns: ["*"]
  description: >
    Choose the Vray scene file you want to render. Textures and other files
    referenced in the vrscene are automatically discovered and added to job
    attachments by the pre-submission hook.
- name: OutputDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: OUT
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Output Directory
    groupLabel: Render Parameters
  default: "./output"
  description: Choose the render output directory.
- name: OutputFilename
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Output File Name
    groupLabel: Render Parameters
  default: "output.png"
  description: Enter the output filename (with extension of choice).
- name: ImageWidth
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Image Width
    groupLabel: Render Parameters
  default: 1920
  description: Width of the output image in pixels.
- name: ImageHeight
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Image Height
    groupLabel: Render Parameters 
  default: 1080
  description: Height of the output image in pixels.

# Region Settings
- name: RegionColumns
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Region Columns
    groupLabel: Region Settings
  default: 2
  minValue: 1
  maxValue: 10
  description: Number of columns to divide the image into.
- name: RegionRows
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Region Rows
    groupLabel: Region Settings
  default: 2
  minValue: 1
  maxValue: 10
  description: Number of rows to divide the image into.

# Frame and Animation Settings
- name: Frames
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Frames
    groupLabel: Render Parameters
  default: "1"
  description: Frame range to render (e.g., "1", "1-10", "1,5,10").
- name: CreateMovie
  type: STRING
  userInterface:
    control: CHECK_BOX
    label: Create Movie
    groupLabel: Render Parameters
  default: "false"
  allowedValues: ["true", "false"]
  description: Create a movie file from the rendered frames using ffmpeg.
- name: MovieFilename
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Movie Filename
    groupLabel: Render Parameters
  default: "output.mp4"
  description: Output movie filename (only used if Create Movie is enabled).
- name: FrameRate
  type: INT
  userInterface:
    control: SPIN_BOX
    label: Frame Rate
    groupLabel: Render Parameters
  default: 24
  minValue: 1
  maxValue: 120
  description: Frame rate for the output movie (only used if Create Movie is enabled).

# Software Environment
- name: CondaPackages
  type: STRING
  userInterface:
    control: LINE_EDIT
    label: Conda Packages
    groupLabel: Software Environment
  default: vray imagemagick ffmpeg
  description: >
    If you have a Queue Environment that creates a Conda environment from a parameter called CondaPackages, this will
    tell it to install vray, imagemagick, and ffmpeg.

steps:
# Step 1: Render each region of each frame in parallel
- name: RenderRegions
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: "{{Param.Frames}}"
    - name: RegionCol
      type: INT
      range: "1-{{Param.RegionColumns}}"
    - name: RegionRow
      type: INT
      range: "1-{{Param.RegionRows}}"
  script:
    actions:
      onRun:
        command: /bin/bash
        args:
        - "{{Param.RenderRegionScript}}"
        - "{{Param.SetupVrayPathMappingScript}}"
        - "{{Param.VraySceneFile}}"
        - "{{Param.OutputDir}}"
        - "{{Param.OutputFilename}}"
        - "{{Session.PathMappingRulesFile}}"
        - "{{Task.Param.Frame}}"
        - "{{Task.Param.RegionCol}}"
        - "{{Task.Param.RegionRow}}"
        - "{{Param.RegionColumns}}"
        - "{{Param.RegionRows}}"
        - "{{Param.ImageWidth}}"
        - "{{Param.ImageHeight}}"
        cancelation:
          mode: NOTIFY_THEN_TERMINATE
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - linux

# Step 2: Merge region tiles into complete frames
- name: MergeRegions
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: "{{Param.Frames}}"
  dependencies:
  - dependsOn: RenderRegions
  script:
    actions:
      onRun:
        command: /bin/bash
        args:
        - "{{Param.MergeRegionsScript}}"
        - "{{Param.OutputDir}}"
        - "{{Param.OutputFilename}}"
        - "{{Task.Param.Frame}}"
        - "{{Param.RegionColumns}}"
        - "{{Param.RegionRows}}"
        cancelation:
          mode: NOTIFY_THEN_TERMINATE
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - linux

# Step 3: Create movie from frame sequence (optional)
- name: CreateMovieFile
  dependencies:
  - dependsOn: MergeRegions
  script:
    actions:
      onRun:
        command: bash
        args: ['{{Task.File.Run}}']
        cancelation:
          mode: NOTIFY_THEN_TERMINATE
    embeddedFiles:
      - name: Run
        type: TEXT
        data: |
          set -xeuo pipefail
          
          if [ "{{Param.CreateMovie}}" != "true" ]; then
            echo "Movie creation disabled, skipping"
            exit 0
          fi
          
          echo "Creating movie from rendered frames..."
          FILENAME="{{Param.OutputFilename}}"
          BASE="${FILENAME%.*}"
          EXT="${FILENAME##*.}"
          OUTPUT_DIR="{{Param.OutputDir}}"
          MOVIE_FILE="{{Param.MovieFilename}}"
          FRAME_RATE={{Param.FrameRate}}
          
          if command -v ffmpeg &> /dev/null; then
            # Create movie from frame sequence using proper frame pattern
            # Pattern: output.%04d.png matches output.0001.png, output.0002.png, etc.
            ffmpeg -framerate $FRAME_RATE -i "${OUTPUT_DIR}/${BASE}.%04d.${EXT}" \
                   -c:v libx264 -pix_fmt yuv420p -crf 18 \
                   "${OUTPUT_DIR}/${MOVIE_FILE}"
            
            echo "Movie created: ${OUTPUT_DIR}/${MOVIE_FILE}"
          else
            echo "Error: ffmpeg not found. Cannot create movie file."
            exit 1
          fi
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - linux
