specificationVersion: jobtemplate-2023-09
extensions: [FEATURE_BUNDLE_1, EXPR]
name: Maya CLI Render
description: |
  This job bundle renders a Maya software renderer scene with the Maya CLI `Render` command.

  To run it, you will need a Maya installation available in the PATH in one of the following ways:
    * As a conda package when your queue has a conda queue environment set up to
      provide virtual environments for jobs.
    * Installed on the worker hosts that run the job. You can customize your Deadline Cloud
      queue, fleets, and this job to fit your own production pipeline.

  See the embedded README.md for more information about this job and its default scene file.

parameterDefinitions:

# Render Parameters
- name: MayaSceneFile
  type: path
  objectType: FILE
  dataFlow: IN
  default: fallinggears.ma
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: Maya Scene File
    groupLabel: Render Parameters
    fileFilters:
    - label: Maya Scene Files
      patterns: ["*.ma", "*.mb"]
    - label: All Files
      patterns: ["*"]
  description: >
    Choose the Maya scene file you want to render.

    Use the 'Job Attachments' tab of the submitter GUI to add textures
    and other files that the job needs.
- name: Frames
  type: range_expr
  default: "1-60"
  userInterface:
    control: LINE_EDIT
    label: Frames
    groupLabel: Render Parameters
- name: CameraName
  type: string
  default: persp
  userInterface:
    control: LINE_EDIT
    label: Camera Name
    groupLabel: Render Parameters
- name: ImageWidth
  type: int
  default: 960
  userInterface:
    control: SPIN_BOX
    label: Image Width
    groupLabel: Render Parameters
- name: ImageHeight
  type: int
  default: 540
  userInterface:
    control: SPIN_BOX
    label: Image Height
    groupLabel: Render Parameters
- name: OutputDir
  type: path
  objectType: DIRECTORY
  dataFlow: OUT
  default: output
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Output Directory
    groupLabel: Render Parameters
  description: Choose the render output directory.
- name: ProjectPath
  type: path
  objectType: DIRECTORY
  dataFlow: IN
  default: "."
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Output Directory
    groupLabel: Render Parameters

# Software Environment
- name: CondaPackages
  type: string
  userInterface:
    # This parameter is for a queue environment, not used directly in the job,
    # so leave the GUI for the queue environment to display.
    control: HIDDEN
  description: Choose which conda packages to install for the render. Requires a conda queue environment to process the value.
  default: maya

steps:

- name: Render
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: INT
      range: "{{ Param.Frames }}"
  bash:
    cancelation:
      mode: NOTIFY_THEN_TERMINATE
    script: |
      set -euo pipefail

      cd {{ repr_sh(Param.ProjectPath) }}

      set -x
      Render -r sw \
          -proj {{ repr_sh(Param.ProjectPath) }} \
          -rd {{ repr_sh(Param.OutputDir) }} \
          -s {{ Task.Param.Frame }} \
          -e {{ Task.Param.Frame }} \
          -pad 4 \
          -fnc "name.#.ext" \
          -cam {{ repr_sh(Param.CameraName) }} \
          -x {{ Param.ImageWidth }} \
          -y {{ Param.ImageHeight }} \
          {{ repr_sh(Param.MayaSceneFile) }}
  hostRequirements:
    attributes:
    - name: attr.worker.os.family
      anyOf:
      - linux
