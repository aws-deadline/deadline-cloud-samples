# Recipe in rattler-build format. See https://rattler.build/
#
# Repackages the official Blender Linux build as a Conda package: download the
# vendor tarball, drop it in the prefix, and put `blender` on PATH. Linux only —
# the sample's fleet is a Linux service-managed fleet. To add another platform,
# add a matching `source` entry and build on that platform.

context:
  version: "4.2.9"
  major_minor_version: "4.2"

package:
  name: blender
  version: ${{ version }}

source:
  url: https://download.blender.org/release/Blender${{ major_minor_version }}/blender-${{ version }}-linux-x64.tar.xz
  sha256: dfbc127a7d28f9c2175b23bf9d6701b2855f31eedfb391f9a6e60adb24572846
  target_directory: blender

build:
  number: 0
  script:
    - bash $RECIPE_DIR/build.sh
  # Blender ships as prebuilt binaries; tell conda not to rewrite the build
  # prefix into them or try to relocate their shared-library links.
  prefix_detection:
    ignore_binary_files: True
  dynamic_linking:
    binary_relocation: False
    missing_dso_allowlist:
    - "**"

tests:
  - script:
    - blender -h

about:
  homepage: https://www.blender.org/
  license: GPL-3.0-or-later
  summary: Blender, the free and open source 3D creation suite (repackaged Linux build).
