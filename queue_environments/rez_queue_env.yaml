specificationVersion: 'environment-2023-09'
extensions: [WRAP_ACTIONS, EXPR, FEATURE_BUNDLE_1]
parameterDefinitions:
  - name: RezPackages
    type: STRING
    description: >
      This is a space-separated list of Rez packages to install for the job.
      E.g. "blender-3.6" for a job that renders frames in Blender 3.6.
    default: ""
    userInterface:
      control: LINE_EDIT
      label: Rez Packages
  - name: RezRepositories
    type: STRING
    description: >
      This is a ':'-separated list of Rez repositories from which to install
      packages.
    # Edit the script code below to set the Linux, Windows, and MacOS repository path,
    # it will search/replace the token REZ_REPOSITORY_PATH in the default to that.
    default: "REZ_REPOSITORY_PATH"
    userInterface:
      control: LINE_EDIT
      label: Rez Repositories
  - name: RezParentVariables
    type: STRING
    description: >
      A comma-separated list of environment variables, such as "PATH,PYTHONPATH",
      for Rez to treat as parent variables when it applies the context to each
      wrapped action. Rez then appends and prepends package values to these
      variables instead of overwriting them, so changes that environments
      entered after this one make to them reach the task. The default, PATH,
      keeps tools that later environments add to PATH, such as a venv or a
      Conda environment. Leave empty to use the Rez configuration of the
      worker. See
      https://rez.readthedocs.io/en/stable/configuring_rez.html#parent_variables
    default: "PATH"
    userInterface:
      control: LINE_EDIT
      label: Rez Parent Variables

environment:
  name: Rez
  script:
    actions:
      onEnter:
        command: "bash"
        args: ["{{ Env.File.Enter }}", "{{ Session.WorkingDirectory }}/rez-context.rxt"]
      # The wrap hooks run each task, and the enter and exit actions of every
      # environment entered after this one, inside the resolved Rez context.
      # Rez applies the whole context in the wrapped process, including aliases
      # and shell functions that cannot be copied into the session as
      # environment variables. The wrapped action arrives as argv, and the hook
      # takes on its timeout and cancelation.
      onWrapEnvEnter:
        command: "python"
        args:
          - "{{ Env.File.Wrap }}"
          - "{{ Param.RezPackages }}"
          - "{{ Param.RezParentVariables }}"
          - "{{ Session.WorkingDirectory }}/rez-context.rxt"
          - "--"
          - "{{ WrappedAction.Command }}"
          - "{{ WrappedAction.Args }}"
        timeout: "{{ WrappedAction.Timeout }}"
        cancelation:
          mode: "{{ WrappedAction.Cancelation.Mode }}"
          notifyPeriodInSeconds: "{{ WrappedAction.Cancelation.NotifyPeriodInSeconds }}"
      onWrapTaskRun:
        command: "python"
        args:
          - "{{ Env.File.Wrap }}"
          - "{{ Param.RezPackages }}"
          - "{{ Param.RezParentVariables }}"
          - "{{ Session.WorkingDirectory }}/rez-context.rxt"
          - "--"
          - "{{ WrappedAction.Command }}"
          - "{{ WrappedAction.Args }}"
        timeout: "{{ WrappedAction.Timeout }}"
        cancelation:
          mode: "{{ WrappedAction.Cancelation.Mode }}"
          notifyPeriodInSeconds: "{{ WrappedAction.Cancelation.NotifyPeriodInSeconds }}"
      onWrapEnvExit:
        command: "python"
        args:
          - "{{ Env.File.Wrap }}"
          - "{{ Param.RezPackages }}"
          - "{{ Param.RezParentVariables }}"
          - "{{ Session.WorkingDirectory }}/rez-context.rxt"
          - "--"
          - "{{ WrappedAction.Command }}"
          - "{{ WrappedAction.Args }}"
        timeout: "{{ WrappedAction.Timeout }}"
        cancelation:
          mode: "{{ WrappedAction.Cancelation.Mode }}"
          notifyPeriodInSeconds: "{{ WrappedAction.Cancelation.NotifyPeriodInSeconds }}"
    embeddedFiles:
    - name: Enter
      filename: rez-queue-env-enter.sh
      type: TEXT
      data: |
        set -euo pipefail

        # argv: <rez-context.rxt>
        CONTEXT_FILE="$1"

        REZ_PACKAGES={{ repr_sh(Param.RezPackages) }}
        REZ_REPOSITORIES={{ repr_sh(Param.RezRepositories) }}

        if [ -z "$REZ_PACKAGES" ]; then
            echo "Skipping Rez env as RezPackages parameter was empty."
            exit 0
        fi

        # Edit these paths for your farm
        LINUX_REZ_REPOSITORY_PATH="/mnt/REZ_REPOSITORY"
        WINDOWS_REZ_REPOSITORY_PATH="R:/REZ_REPOSITORY"
        MACOS_REZ_REPOSITORY_PATH="/Volumes/REZ_REPOSITORY"

        if [[ "$(uname -s)" == MINGW* ]]; then
            REZ_REPOSITORY_PATH="$WINDOWS_REZ_REPOSITORY_PATH"
        elif [[ "$(uname)" == Darwin ]]; then
            REZ_REPOSITORY_PATH="$MACOS_REZ_REPOSITORY_PATH"
        else
            REZ_REPOSITORY_PATH="$LINUX_REZ_REPOSITORY_PATH"
        fi
        echo "DEBUG: Rez repository contents:"
        ls -al $REZ_REPOSITORY_PATH
        REZ_REPOSITORIES="${REZ_REPOSITORIES//REZ_REPOSITORY_PATH/$REZ_REPOSITORY_PATH}"

        echo "Rez Package List:"
        echo "   $REZ_PACKAGES"

        # Resolve the packages once and save the context to the session
        # directory. The wrap hooks run every task in this saved context, so
        # all tasks see the same environment without resolving again.
        rez env --paths "$REZ_REPOSITORIES" $REZ_PACKAGES --output "$CONTEXT_FILE"
        rez context "$CONTEXT_FILE"
    - name: Wrap
      filename: rez-queue-env-wrap.py
      type: TEXT
      data: |
        import os
        import platform
        import subprocess
        import sys

        # argv: <RezPackages> <RezParentVariables> <rez-context.rxt> -- <command> [args ...]
        rez_packages, rez_parent_variables, context_file, separator, *wrapped = sys.argv[1:]
        if separator != "--":
            print(f"openjd_fail: Expected '--' before the wrapped command, got {separator!r}.")
            sys.exit(1)

        # onEnter skips resolving when RezPackages is empty, so there is no
        # context to run in. Run the wrapped action unchanged.
        if rez_packages == "":
            sys.exit(subprocess.run(wrapped).returncode)

        # Packages were requested, so onEnter saved a context here. If it is
        # missing, fail rather than run the action outside the Rez context.
        if not os.path.isfile(context_file):
            print(f"openjd_fail: The saved Rez context {context_file} does not exist.")
            sys.exit(1)

        # Run the wrapped command inside the saved context. Rez passes the
        # command and arguments after `--` to the shell as one command line in
        # double quotes, so the shell expands `$VAR` and `$(...)` in them, the
        # same as a command typed after `rez env --`. See the `-c`/`--`
        # description in https://rez.readthedocs.io/en/stable/commands/rez-env.html
        # and the `Shell.join` comment in
        # https://github.com/AcademySoftwareFoundation/rez/blob/3.4.0/src/rez/shells.py#L315-L339
        # Rez overwrites a variable the first time a package modifies it, and
        # rebuilds PATH from the system paths, so it would discard changes
        # that environments entered after this one made. Parent variables are
        # appended and prepended to instead. Set this only for the Rez call
        # so the worker's Rez configuration applies when it's empty.
        if rez_parent_variables:
            os.environ["REZ_PARENT_VARIABLES"] = rez_parent_variables

        rez_shell = "gitbash" if platform.system() == "Windows" else "bash"
        command = ["rez", "env", "--input", context_file, "--shell", rez_shell, "--", *wrapped]

        # On POSIX, replace this process so a cancelation signal reaches Rez,
        # which passes it on to the wrapped process. Windows has no exec, so
        # run Rez as a child and return its exit status.
        if os.name == "posix":
            os.execvp(command[0], command)
        sys.exit(subprocess.run(command).returncode)
