specificationVersion: "environment-2023-09"
parameterDefinitions:
- name: CondaPackages
  type: STRING
  description: >
    This is a space-separated list of Conda package match specifications to
    install for the job. E.g. "blender=4.3" for a job that renders frames in
    Blender 4.3.
  default: ""
  userInterface:
    control: LINE_EDIT
    label: Conda Packages
- name: CondaChannels
  type: STRING
  description: >
    This is a space-separated list of Conda channels from which to install
    packages. Deadline Cloud service-managed fleet packages are installed from the
    "deadline-cloud" channel that is configured by Deadline Cloud.

    Add "conda-forge" to get packages from the https://conda-forge.org/
    community, and "defaults" to get packages from Anaconda Inc (make sure
    your usage complies with https://legal.anaconda.com/policies).
  default: "deadline-cloud"
  userInterface:
    control: LINE_EDIT
    label: Conda Channels
- name: ChannelPriority
  type: STRING
  description: >
    Choose between "strict" and "disabled" channel priority.

    With strict channel priority, packages in lower priority channels are not considered
    if a package with the same name appears in a higher priority channel.

    With channel priority disabled, package version takes precedence, and the
    configured priority of channels is used only to break ties.
    
    (see https://docs.conda.io/projects/conda/en/latest/user-guide/tasks/manage-channels.html)
  default: "strict"
  allowedValues: ["strict", "disabled"]
  userInterface:
    control: DROPDOWN_LIST
    label: Conda Channel Priority
- name: PersitentEnvDir
  type: STRING
  description: >
    The directory where reusable hash named environments are stored.

    Environments will be stored as <PersitentEnvDir>/hashname_<hash>, where the hash
    is computed from the channels and requested packages.
  default: "~/.hashed_envs"
  userInterface:
    control: LINE_EDIT
    label:  Persistent Environment Directory
- name: UpdateAfterMinutes
  type: INT
  description: |
    How long before a peristent environment is re-solved and updated.
  default: "600"
  userInterface:
    control: SPIN_BOX
    label: Conda Environment Update After (Minutes)
- name: CleanupAfterHours
  type: INT
  description: |
    How long before stale persisted environments are removed
  default: "96"
  userInterface:
    control: SPIN_BOX
    label: Conda Environment Cleanup After (Hours)

environment:
  name: Conda
  script:
    actions:
      onEnter:
        command: "conda-queue-env-enter"
        args:
        - "{{Session.WorkingDirectory}}/.env"
        - "--packages"
        - "{{Param.CondaPackages}}"
        - "--channels"
        - "{{Param.CondaChannels}}"
        - "--channel-priority"
        - "{{Param.ChannelPriority}}"
        - "--persist-envs-hashed"
        - "{{Param.PersitentEnvDir}}"
        - "--update-after-minutes"
        - "{{Param.UpdateAfterMinutes}}"
      onExit:
        command: "conda-queue-env-exit"
        args:
        - "--cleanup-after-hours"
        - "{{Param.CleanupAfterHours}}"
