specificationVersion: 'environment-2023-09'
environment:
  name: CopyOutputsToS3
  description: |
    Copies the job attachments output files of each session to an additional
    S3 location when the session ends, so rendered outputs land in a bucket
    you choose (for example a production or delivery bucket) without changing
    the submitters artists use.

    Edit DESTINATION_BUCKET and DESTINATION_PREFIX in the onExit action below.
    Files are written to s3://DESTINATION_BUCKET/DESTINATION_PREFIX/<job id>/<output path>,
    where <output path> is the path of the file relative to the job attachments
    root it was submitted from, e.g. "renders/beauty/frame_0001.exr".

    The queue role needs s3:PutObject on the destination bucket and prefix in
    addition to the defaults.

    This sample finds the job's output directories by reading the job attachments
    properties that the Deadline Cloud worker agent writes into the session
    directory. That file is an internal detail of the worker agent, not a
    documented interface, so a future worker agent release can change it.
  script:
    actions:
      onExit:
        command: bash
        args:
        - '{{Env.File.Exit}}'
        - '{{Env.File.CopyOutputs}}'
        # DESTINATION_BUCKET
        - 'amzn-s3-demo-bucket'
        # DESTINATION_PREFIX, leave empty to write to the root of the bucket
        - 'deadline-outputs'
        - '{{Session.WorkingDirectory}}'
        timeout: 3600
    embeddedFiles:
    - name: Exit
      filename: copy-outputs-exit.sh
      type: TEXT
      data: |
        #!/bin/env bash
        set -euo pipefail

        # Find a Python interpreter. Prefer python3, but fall back to python
        # (for example, on Windows worker hosts running git bash).
        if command -v python3 > /dev/null 2>&1; then
            PYTHON=python3
        else
            PYTHON=python
        fi

        "$PYTHON" "$@"
    - name: CopyOutputs
      filename: copy_outputs.py
      type: TEXT
      data: |
        import glob
        import json
        import os
        import subprocess
        import sys

        _, bucket, prefix, session_dir = sys.argv

        job_id = os.environ["DEADLINE_JOB_ID"]

        # The worker agent writes the job attachments properties of the session, including each
        # root's local path and output directories, as JSON files in the session's embedded files
        # directories. Collect the output directories for each local root.
        output_dirs_by_root = {}
        for path in glob.glob(os.path.join(session_dir, "embedded_files*", "*")):
            try:
                with open(path) as f:
                    properties = json.load(f)
            except (OSError, ValueError):
                continue
            if not isinstance(properties, list):
                continue
            for root in properties:
                if not isinstance(root, dict) or "manifestProperties" not in root:
                    continue
                output_dirs = output_dirs_by_root.setdefault(root["localRootPath"], set())
                output_dirs.update(root["manifestProperties"].get("outputRelativeDirectories", []))

        if not output_dirs_by_root:
            print("No job attachments properties found in the session, so there are no outputs to copy.")
            sys.exit(0)

        destination = f"s3://{bucket}/" + "/".join(part for part in [prefix.strip("/"), job_id] if part)

        copied_any = False
        for local_root, output_dirs in sorted(output_dirs_by_root.items()):
            for output_dir in sorted(output_dirs):
                output_dir = output_dir.replace("\\", "/").strip("/")
                local_dir = os.path.normpath(os.path.join(local_root, output_dir))
                if not os.path.isdir(local_dir) or not os.listdir(local_dir):
                    print(f"Output directory {local_dir} has no files in this session.")
                    continue
                target = destination if output_dir in ("", ".") else f"{destination}/{output_dir}"
                print(f"Copying {local_dir} to {target}/")
                sys.stdout.flush()
                subprocess.run(
                    ["aws", "s3", "cp", "--recursive", "--only-show-errors", local_dir, target + "/"],
                    check=True,
                )
                copied_any = True

        if copied_any:
            print(f"Finished copying outputs to {destination}/")
        else:
            print("No output files were found in this session.")
