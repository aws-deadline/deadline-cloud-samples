name: Documentation validation

on:
  pull_request:
  push:
    branches: [mainline]
  schedule:
    - cron: "17 8 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: documentation-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Unit and static checks
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run repository validation
        run: python3 scripts/validate_repository.py

  external-links:
    name: Live external Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check live external links
        run: python3 scripts/check_external_links.py
