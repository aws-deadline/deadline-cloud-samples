specificationVersion: 'jobtemplate-2023-09'
# EXPR provides repr_sh(), which quotes each parameter value for the shell scripts below,
# so a value such as a run name with an apostrophe can't break or change a command.
extensions: [EXPR]
name: LIBERO policy evaluation
description: >-
  Evaluates a LeRobot policy on the LIBERO benchmark. Each task runs one LIBERO task of
  one suite, and a final step totals the results into a scorecard. The queue's Docker
  environment runs the commands inside the libero-eval-gpu image.

parameterDefinitions:
# Read by the queue's Docker environment, which pulls this image and runs every task
# inside it. Keep it a plain STRING so it matches the queue's own DockerImage definition.
- name: DockerImage
  type: STRING
  description: >-
    The libero-eval-gpu image in your Amazon ECR repository, by tag or digest, for example
    <account-id>.dkr.ecr.<region>.amazonaws.com/libero-eval-gpu:0.6.1-mj3.3.7
  userInterface:
    control: LINE_EDIT
    label: Container Image URI
- name: PolicyPath
  type: STRING
  default: lerobot/xvla-libero
  description: Hugging Face repository of the policy. It must be baked into the image.
- name: TaskIds
  type: STRING
  default: "0-9"
  description: LIBERO task indices to run in every suite, for example 0-9 or 0,3,5.
- name: Episodes
  type: INT
  default: 10
  minValue: 1
  maxValue: 50
  description: Episodes per task. Each LIBERO task has 50 fixed starting layouts.
- name: BatchSize
  type: INT
  default: 10
  minValue: 1
  description: Episodes simulated in parallel within one task.
- name: NActionSteps
  type: INT
  default: 0
  minValue: 0
  description: >-
    Actions executed per policy call. 0 keeps the checkpoint's own setting. 1 re-plans after
    every action, as the SmolVLA paper does.
- name: ControlMode
  type: STRING
  default: absolute
  allowedValues: [relative, absolute]
  description: LIBERO action parameterization. It must match the policy (absolute for X-VLA, relative for SmolVLA).
- name: EpisodeLength
  type: INT
  default: 800
  minValue: 0
  description: Maximum steps per episode. 0 uses each suite's default.
- name: CameraFlags
  type: STRING
  default: none
  allowedValues: [none, camera_mapping]
  description: >-
    none keeps LIBERO's camera names (image, image2). camera_mapping renames them to
    camera1 and camera2, which lerobot/smolvla_libero expects.
- name: MinSuccessRate
  type: FLOAT
  default: 0.0
  minValue: 0.0
  maxValue: 100.0
  description: Fail the Aggregate step if overall success, in percent, is below this. 0 disables the gate.
- name: RunName
  type: STRING
  default: ""
  description: >-
    Name for this job's TensorBoard run, for example the hypothesis it tests. Blank uses the
    policy name. Give each job its own name when you compare jobs in one TensorBoard.
- name: OutputDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: OUT
  default: ./output
  description: Where per-task results, rollout videos and the scorecard are written.
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Output Directory
- name: JobScriptDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: IN
  default: scripts
  userInterface:
    control: HIDDEN

steps:
- name: Eval
  hostRequirements:
    amounts:
    - name: amount.worker.gpu
      min: 1
    - name: amount.worker.memory
      min: 49152
  parameterSpace:
    taskParameterDefinitions:
    - name: Suite
      type: STRING
      range: [libero_spatial, libero_object, libero_goal, libero_10]
    - name: TaskId
      type: INT
      range: "{{Param.TaskIds}}"
  script:
    let:
    - out_dir = Param.OutputDir / 'tasks' / (Task.Param.Suite + '_task' + string(Task.Param.TaskId))
    actions:
      onRun:
        command: bash
        args: ['{{Task.File.Run}}']
        # One task takes a few minutes. Stop a hung simulator before it keeps a GPU worker busy.
        timeout: 1800
    embeddedFiles:
    - name: Run
      type: TEXT
      data: |
        #!/usr/bin/env bash
        set -euo pipefail
        OUT={{ repr_sh(out_dir) }}
        mkdir -p "$OUT"

        ARGS=(--policy.path={{ repr_sh(Param.PolicyPath) }} --policy.device=cuda
              --env.type=libero --env.task={{ repr_sh(Task.Param.Suite) }} --env.task_ids='[{{Task.Param.TaskId}}]'
              --env.control_mode={{ repr_sh(Param.ControlMode) }}
              --eval.n_episodes={{Param.Episodes}} --eval.batch_size={{Param.BatchSize}}
              --seed=1000 --env.max_parallel_tasks=1 --output_dir="$OUT/eval")
        [ {{Param.NActionSteps}} -gt 0 ] && ARGS+=(--policy.n_action_steps={{Param.NActionSteps}})
        [ {{Param.EpisodeLength}} -gt 0 ] && ARGS+=(--env.episode_length={{Param.EpisodeLength}})
        if [ {{ repr_sh(Param.CameraFlags) }} = camera_mapping ]; then
          ARGS+=('--env.camera_name_mapping={"agentview_image": "camera1", "robot0_eye_in_hand_image": "camera2"}')
        fi

        lerobot-eval "${ARGS[@]}"

        GPU=$(python -c "import torch; print(torch.cuda.get_device_name(0))" 2>/dev/null || echo unknown)
        printf '{"gpu": "%s", "render_backend": "%s", "image": "%s"}\n' \
          "$GPU" "${MUJOCO_GL:-unknown}" {{ repr_sh(Param.DockerImage) }} > "$OUT/worker.json"

- name: Aggregate
  dependencies:
  - dependsOn: Eval
  script:
    actions:
      onRun:
        command: bash
        args: ['{{Task.File.Run}}']
        timeout: 600
    embeddedFiles:
    - name: Run
      type: TEXT
      data: |
        #!/usr/bin/env bash
        set -euo pipefail
        python {{ repr_sh(Param.JobScriptDir / 'aggregate_scorecard.py') }} {{ repr_sh(Param.OutputDir) }} \
          --policy {{ repr_sh(Param.PolicyPath) }} --min-success-rate {{Param.MinSuccessRate}} \
          --run-name {{ repr_sh(Param.RunName) }} \
          --hparam n_action_steps={{Param.NActionSteps}} --hparam {{ repr_sh('control_mode=' + Param.ControlMode) }} \
          --hparam episode_length={{Param.EpisodeLength}} --hparam {{ repr_sh('camera_flags=' + Param.CameraFlags) }} \
          --hparam episodes={{Param.Episodes}} --hparam {{ repr_sh('task_ids=' + Param.TaskIds) }}
