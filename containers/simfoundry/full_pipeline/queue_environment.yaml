specificationVersion: "environment-2023-09"
extensions:
  - WRAP_ACTIONS
  - EXPR
parameterDefinitions:
  - name: DockerImage
    type: STRING
    description: >
      The ECR container image URI to pull and use for jobs.
      Format: <account>.dkr.ecr.<region>.amazonaws.com/<repo>:<tag>
    default: ""
    userInterface:
      control: LINE_EDIT
      label: Container Image URI
  - name: ImageCacheCleanupAfterHours
    type: INT
    description: Cached container images not used within this many hours are removed at session exit.
    default: 96
    userInterface:
      control: SPIN_BOX
      label: Cleanup Unused Images After (Hours)
  - name: SecretId
    type: STRING
    description: >
      Secrets Manager secret holding a JSON object of environment variables, such as HF_TOKEN,
      passed into the container. The queue role must be allowed to read it. Empty for none.
    default: ""
    userInterface:
      control: LINE_EDIT
      label: Secret for Container Environment
environment:
  name: DockerContainer
  script:
    actions:
      onEnter:
        command: bash
        args: ["{{Env.File.Enter}}"]
      # All three hooks share the static Wrap script: forward session env as `-e KEY=value`, then `--`, then the command + args.
      onWrapEnvEnter:
        command: bash
        args:
          - "{{Env.File.Wrap}}"
          - "{{ flatten([['-e', e] for e in WrappedAction.Environment]) }}"
          - "--"
          - "{{WrappedAction.Command}}"
          - "{{WrappedAction.Args}}"
      onWrapTaskRun:
        command: bash
        args:
          - "{{Env.File.Wrap}}"
          - "{{ flatten([['-e', e] for e in WrappedAction.Environment]) }}"
          - "--"
          - "{{WrappedAction.Command}}"
          - "{{WrappedAction.Args}}"
      onWrapEnvExit:
        command: bash
        args:
          - "{{Env.File.Wrap}}"
          - "{{ flatten([['-e', e] for e in WrappedAction.Environment]) }}"
          - "--"
          - "{{WrappedAction.Command}}"
          - "{{WrappedAction.Args}}"
      onExit:
        command: bash
        args: ["{{Env.File.Exit}}"]
    embeddedFiles:
      - name: Enter
        type: TEXT
        runnable: true
        data: |
          #!/usr/bin/env bash
          set -uo pipefail
          PREFIX=/opt/deadline/docker-rootless
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          export DOCKER_HOST="unix://${XDG_RUNTIME_DIR}/docker.sock"
          SOCK="${XDG_RUNTIME_DIR}/docker.sock"
          ready() { [ -S "$SOCK" ] && "$PREFIX/bin/docker" info >/dev/null 2>&1; }

          mkdir -p "${HOME}/.config/systemd/user"
          cat > "${HOME}/.config/systemd/user/docker.service" <<UNITFILE
          [Unit]
          Description=Rootless Docker for Deadline job-user
          StartLimitIntervalSec=0

          [Service]
          Environment=PATH=${PREFIX}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/sbin:/usr/bin:/bin
          ExecStartPre=-/usr/bin/rm -f %t/docker.sock
          ExecStart=${PREFIX}/bin/dockerd-rootless.sh
          Restart=no
          TimeoutStartSec=90
          TimeoutStopSec=15
          KillMode=control-group
          Delegate=yes
          Type=notify
          NotifyAccess=all
          UNITFILE

          for i in $(seq 1 120); do
            case "$(systemctl --user is-system-running 2>/dev/null)" in
              running|degraded)
                systemctl --user daemon-reload 2>/dev/null
                if ! ready; then  # onExit is skipped if the worker dies mid-session; clear what it left
                  systemctl --user reset-failed docker.service 2>/dev/null
                  pkill -9 -u "$(id -u)" -x rootlesskit 2>/dev/null
                  rm -f "$SOCK"
                fi
                systemctl --user start docker.service 2>/dev/null && break
                ;;
            esac
            sleep 1
          done

          for i in $(seq 1 90); do ready && break; sleep 1; done
          if ! ready; then
            systemctl --user status docker.service --no-pager 2>&1 | head -5
            echo "openjd_fail: rootless docker daemon not available"
            exit 1
          fi

          REGION=$(ec2-metadata --availability-zone | awk '{print $2}' | sed 's/[a-z]$//')
          REGISTRY=$(echo {{ repr_sh(Param.DockerImage) }} | cut -d'/' -f1)
          case "$REGISTRY" in
            *.dkr.ecr.*.amazonaws.com) ;;
            *) echo "openjd_fail: not an ECR registry: ${REGISTRY}"; exit 1 ;;
          esac
          export DOCKER_CONFIG="${XDG_RUNTIME_DIR}/deadline-docker-config"; rm -f "${HOME}/.docker/config.json"
          if ! aws ecr get-login-password --region "${REGION}" | docker login --username AWS --password-stdin "${REGISTRY}"; then
            echo "openjd_fail: ECR login failed for ${REGISTRY} in ${REGION}"
            exit 1
          fi

          if ! docker pull {{ repr_sh(Param.DockerImage) }}; then
            echo 'openjd_fail: could not pull' {{ repr_sh(Param.DockerImage) }}
            exit 1
          fi

          # docker exec starts a clean env: forward the known license vars only, never the
          # whole host env (AWS creds).
          LICENSE_ENV_FILE="{{Session.WorkingDirectory}}/.docker-license.env"
          : > "$LICENSE_ENV_FILE"
          for var in ADSKFLEX_LICENSE_FILE foundry_LICENSE LUXION_LICENSE_FILE PIXAR_LICENSE_FILE \
                     g_licenseServerRLM redshift_LICENSE SESI_LMHOST VRAY_AUTH_CLIENT_SETTINGS \
                     VRAY_AUTH_CLIENT_FILE_PATH FLEXLM_TIMEOUT; do
            [ -n "${!var:-}" ] && echo "${var}=${!var}" >> "$LICENSE_ENV_FILE"
          done
          echo "openjd_env: DOCKER_LICENSE_ENV_FILE=${LICENSE_ENV_FILE}"

          # Container environment from one Secrets Manager secret. The file stays in the
          # session directory, which job attachments never upload, and onExit deletes it.
          SECRETS_ENV_FILE="{{Session.WorkingDirectory}}/.docker-secrets.env"
          ( umask 077; : > "$SECRETS_ENV_FILE" )
          SECRET_ID={{ repr_sh(Param.SecretId) }}
          if [ -n "$SECRET_ID" ]; then
            if ! aws secretsmanager get-secret-value --region "$REGION" --secret-id "$SECRET_ID" \
                --query SecretString --output text | python3 {{ repr_sh(Env.File.SecretToEnv) }} > "$SECRETS_ENV_FILE"; then
              echo "openjd_fail: could not read secret ${SECRET_ID} into the container environment"
              exit 1
            fi
            echo "Container environment from ${SECRET_ID}: $(cut -d= -f1 "$SECRETS_ENV_FILE" | tr '\n' ' ')"
          fi

          # Queue-role credentials for code in the container, such as Bedrock calls. The container
          # gets a config whose credential_process reads a file in the session directory, and a
          # user unit rewrites that file every few minutes for the life of the session.
          CRED_DIR="{{Session.WorkingDirectory}}/.container-aws"
          CRED_UNIT="deadline-container-creds-$(basename {{ repr_sh(Session.WorkingDirectory) }})"
          ( umask 077; mkdir -p "$CRED_DIR" )
          if ! bash {{ repr_sh(Env.File.RefreshCreds) }} "$CRED_DIR" once; then
            echo "openjd_fail: could not export queue-role credentials for the container"
            exit 1
          fi
          printf '[default]\ncredential_process = cat %s/creds.json\nregion = %s\n' "$CRED_DIR" "$REGION" > "$CRED_DIR/config"
          SETENV=()
          while IFS= read -r line; do SETENV+=(--setenv="$line"); done < <(env | grep -E '^(AWS_[A-Z_]+|PATH|HOME)=')
          if ! systemd-run --user --quiet --collect --unit "$CRED_UNIT" "${SETENV[@]}" \
              bash {{ repr_sh(Env.File.RefreshCreds) }} "$CRED_DIR" loop; then
            echo "openjd_fail: could not start the credential refresher"
            exit 1
          fi
          echo "openjd_env: DOCKER_CRED_UNIT=${CRED_UNIT}"
          echo "Container credentials expire $(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["Expiration"])' "$CRED_DIR/creds.json") and refresh every 5 minutes"

          GPU_ARGS=()
          [ -f /etc/cdi/nvidia.yaml ] && GPU_ARGS=(--gpus all)

          if ! DOCKER_CONTAINER_ID=$(docker container run --rm --detach "${GPU_ARGS[@]}" \
              --entrypoint /bin/sh \
              --env-file "$SECRETS_ENV_FILE" \
              --env AWS_CONFIG_FILE="$CRED_DIR/config" \
              --env AWS_SHARED_CREDENTIALS_FILE=/dev/null \
              --env AWS_EC2_METADATA_DISABLED=true \
              --env AWS_REGION="$REGION" \
              --mount {{ repr_sh("type=bind,src=" + Session.WorkingDirectory + ",dst=" + Session.WorkingDirectory) }} \
              --workdir {{ repr_sh(Session.WorkingDirectory) }} \
              {{ repr_sh(Param.DockerImage) }} \
              -c 'trap exit TERM; while :; do sleep 1 & wait $!; done'); then
            echo "openjd_fail: could not start the session container"
            exit 1
          fi
          echo "openjd_env: DOCKER_CONTAINER_ID=${DOCKER_CONTAINER_ID}"
          echo "openjd_env: DOCKER_HOST=${DOCKER_HOST}"
          exit 0
      # Shared by all three wrap hooks. argv: [-e KEY=value ...] -- <command> [args ...]
      - name: Wrap
        type: TEXT
        runnable: true
        data: |
          #!/usr/bin/env bash
          set -euo pipefail
          exec_cmd=(docker container exec --user 0:0)
          if [ -s "${DOCKER_LICENSE_ENV_FILE:-}" ]; then
            exec_cmd+=(--env-file "$DOCKER_LICENSE_ENV_FILE")
          fi
          while [ "$#" -gt 0 ] && [ "$1" != "--" ]; do
            exec_cmd+=("$1")
            shift
          done
          shift
          exec "${exec_cmd[@]}" "$DOCKER_CONTAINER_ID" "$@"
      # Reads a secret's JSON object on stdin and writes KEY=value lines for docker --env-file.
      - name: SecretToEnv
        type: TEXT
        data: |
          import json, re, sys
          values = json.load(sys.stdin)
          if not isinstance(values, dict):
              sys.exit("secret must be a JSON object of environment variables")
          for key, value in values.items():
              if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", key) or "\n" in str(value):
                  sys.exit(f"secret key {key!r} is not a valid environment variable")
              print(f"{key}={value}")
      # argv: <dir> once|loop. Writes credential_process JSON for the queue role to <dir>/creds.json.
      - name: RefreshCreds
        type: TEXT
        data: |
          set -uo pipefail
          dir="$1"
          write() {
            umask 077
            aws configure export-credentials --format process > "$dir/creds.json.tmp" \
              && mv -f "$dir/creds.json.tmp" "$dir/creds.json"
          }
          if [ "$2" = once ]; then write; exit; fi
          while sleep 300; do write || echo "credential refresh failed" >&2; done
      - name: Exit
        type: TEXT
        runnable: true
        data: |
          #!/usr/bin/env bash
          set -uo pipefail
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          [ -n "${DOCKER_CONTAINER_ID:-}" ] && docker container stop -t 30 "$DOCKER_CONTAINER_ID" 2>/dev/null
          MARKERS="${HOME}/.local/share/deadline-docker/last-used"; mkdir -p "$MARKERS"
          id=$(docker image ls -q --no-trunc {{ repr_sh(Param.DockerImage) }} 2>/dev/null | head -1); [ -n "$id" ] && touch "$MARKERS/$id"
          CUTOFF=$(( $(date +%s) - {{Param.ImageCacheCleanupAfterHours}} * 3600 ))
          for id in $(docker image ls -q --no-trunc 2>/dev/null | sort -u); do
            [ -f "$MARKERS/$id" ] || { touch "$MARKERS/$id"; continue; }
            [ "$(stat -c %Y "$MARKERS/$id")" -lt "$CUTOFF" ] && docker image rm -f "$id" >/dev/null 2>&1 && rm -f "$MARKERS/$id"
          done
          [ -n "${DOCKER_CRED_UNIT:-}" ] && systemctl --user stop "$DOCKER_CRED_UNIT" 2>/dev/null
          rm -rf "{{Session.WorkingDirectory}}/.container-aws" "{{Session.WorkingDirectory}}/.docker-secrets.env"
          systemctl --user stop docker.service 2>/dev/null
          rm -rf "${XDG_RUNTIME_DIR}/deadline-docker-config"
          # Orderly manager shutdown before the agent's cleanup SIGTERMs it
          systemctl --user exit 2>/dev/null
          exit 0
