# Every command below targets the simfoundry-rocky10 image.
# The queue's Docker environment runs each one inside the container, so nothing
# here pulls an image or starts a container.
specificationVersion: jobtemplate-2023-09
extensions: [EXPR]
name: SimFoundry Examples
description: >-
  Reconstructs depth and a point cloud from a tabletop video with SimFoundry's pipeline A, and
  runs OmniGibson random-action rollouts in SimFoundry's published example scenes.

parameterDefinitions:
# Read by the queue's Docker environment. Keep it a plain STRING so it matches
# the queue's own DockerImage definition.
- name: DockerImage
  type: STRING
  description: >-
    The simfoundry-rocky10 image in Amazon ECR, for example
    <account-id>.dkr.ecr.<region>.amazonaws.com/simfoundry:9e34ebe-rocky10
  userInterface:
    control: LINE_EDIT
    label: Container Image URI
- name: Video
  type: STRING
  default: /opt/SimFoundry/docs/assets/example_videos/Fruits.mp4
  description: The tabletop video to reconstruct. The default is one of SimFoundry's example captures.
- name: SceneName
  type: STRING
  default: fruits
  description: Name of the reconstructed scene, used for its output directory.
- name: Frames
  type: INT
  default: 15
  minValue: 2
  maxValue: 220
  description: Frames sampled from the video for depth estimation.
- name: SimSteps
  type: INT
  default: 60
  minValue: 1
  description: Random-action steps per example scene, at 15 actions per second.
- name: AssetsRevision
  type: STRING
  default: beac75a98d99a881eacff25dd53a3ec9ce8efcfc
  description: Commit of the nadunRanawaka1/simfoundry-assets dataset on Hugging Face.
- name: OutputDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: OUT
  default: ./output
  description: Where the reconstruction and the rollout videos are written.
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Output Directory
- name: JobScriptDir
  type: PATH
  objectType: DIRECTORY
  dataFlow: IN
  default: scripts
  description: Helper scripts uploaded with the job.
  userInterface:
    control: HIDDEN

steps:
- name: Reconstruct
  # Stages 1b (sample the video) and 2 (Depth Anything 3) are the part of pipeline A that
  # needs no Gemini or gated Hugging Face credentials.
  # The fleet chooses the GPU. Use A10G or L4 workers: a T4 has 16 GiB and an architecture
  # the image isn't built for.
  hostRequirements:
    amounts:
    - name: amount.worker.gpu
      min: 1
  script:
    actions:
      onRun:
        command: bash
        args: ["{{ Task.File.Run }}"]
        timeout: 3600
    embeddedFiles:
    - name: Run
      type: TEXT
      data: |
        set -euo pipefail
        bash /opt/SimFoundry/scripts/pipeline/A_reconstruction/run.sh \
          --include 1b,2 \
          --root-dir {{ repr_sh(Param.OutputDir) }} \
          --scene-name {{ repr_sh(Param.SceneName) }} \
          --video-fpath {{ repr_sh(Param.Video) }} \
          -- s1_video.n_subsampled_frames={{ Param.Frames }}
        mamba run -n simfoundry python {{ repr_sh(Param.JobScriptDir / 'depth_preview.py') }} \
          {{ repr_sh(Param.OutputDir / Param.SceneName) }}
        # Every decoded frame of the video, about 430 MB for the default. Depth reads only the
        # sampled frames, so don't upload the rest as job output.
        rm -rf {{ repr_sh(Param.OutputDir / Param.SceneName / 's1_video' / 'frames_all') }}

- name: Simulate
  # One task per published DROID scene, each a Franka arm at a desk.
  hostRequirements:
    amounts:
    - name: amount.worker.gpu
      min: 1
    # SMF workers use strict overcommit. On a 32 GiB worker, Isaac Sim leaves too little
    # commit headroom to start ffmpeg, so the rollout video fails with ENOMEM.
    - name: amount.worker.memory
      min: 60000
  parameterSpace:
    taskParameterDefinitions:
    - name: Scene
      type: STRING
      range:
      - droid_desk_serve_fruits
      - droid_desk_put_marker_in_cup
      - droid_desk_stack_dishware
      - droid_desk_store_marker
      - droid_desk_throw_away_trash
  stepEnvironments:
  # Download the public example scenes once per session, not once per task.
  - name: ExampleScenes
    script:
      actions:
        onEnter:
          command: mamba
          args:
          - run
          - -n
          - simfoundry
          - hf
          - download
          - nadunRanawaka1/simfoundry-assets
          - --repo-type
          - dataset
          - --revision
          - "{{ Param.AssetsRevision }}"
          - --local-dir
          - "{{ Session.WorkingDirectory / 'simfoundry-assets' }}"
          timeout: 1800
  script:
    let:
    - scene_json = Session.WorkingDirectory / 'simfoundry-assets' / 'assets' / 'scenes' / 'DROID' / Task.Param.Scene / (Task.Param.Scene + '_scene_state_latest.json')
    - video = Param.OutputDir / 'simulate' / (Task.Param.Scene + '.mp4')
    actions:
      onRun:
        command: bash
        args: ["{{ Task.File.Run }}"]
        timeout: 3600
    embeddedFiles:
    - name: Run
      type: TEXT
      data: |
        set -euo pipefail
        mkdir -p {{ repr_sh(Param.OutputDir / 'simulate') }}
        mamba run -n simfoundry python \
          /opt/SimFoundry/scripts/pipeline/C_application/stages/0_smoke_random_actions.py \
          --scene-json {{ repr_sh(scene_json) }} \
          --n-steps {{ Param.SimSteps }} \
          --video-path {{ repr_sh(video) }} \
          root_dir={{ repr_sh(Param.OutputDir / 'simulate') }} \
          scene_name={{ repr_sh(Task.Param.Scene) }}
        # Isaac Sim exits 0 at shutdown even after an error, so check for the video.
        test -s {{ repr_sh(video) }} || { echo "No rollout video at {{ video }}" >&2; exit 1; }
