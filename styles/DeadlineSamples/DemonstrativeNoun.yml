extends: existence
message: "Avoid '%s' as a standalone pronoun -- name the noun it refers to (e.g. 'this queue', 'these steps')."
link: https://developers.google.com/style/pronouns#ambiguous-pronoun-references
level: error
nonword: false
tokens:
  - '\b[Tt]his\s+(?:is|are|was|were|will|would|can|could|should|shall|may|might|must|has|have|had|does|do|allows?|means?|provides?|shows?|makes?|creates?|ensures?|helps?|lets?|requires?|enables?|causes?|contains?|includes?|sets?|gets?|adds?|removes?|uses?|works?|happens?|occurs?|refers?|assumes?|expects?)\b'
  - '\b[Tt]hese\s+(?:are|were|will|would|can|could|should|shall|may|might|must|have|had|do|allow|mean|provide|show|make|create|ensure|help|let|require|enable|cause|contain|include|set|get|add|remove|use|work|happen|occur|refer|assume|expect)\b'
