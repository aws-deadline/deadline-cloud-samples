# Recipe in rattler-build format.
# See https://prefix-dev.github.io/rattler-build/latest/
#
# AYON Launcher conda package for Deadline Cloud workers.
# Repackages the pre-built cx_Freeze launcher release into a conda package.
# The launcher provides the Python runtime, ayon-python-api, and CLI entry point.
# Studio-specific bundles (addons + deps) are delivered separately via job attachments.

context:
  version: "1.6.1"

package:
  name: ayon-launcher
  version: ${{ version }}

source:
  - if: linux
    then:
      url: https://github.com/ynput/ayon-launcher/releases/download/${{ version }}/AYON-${{ version }}-linux-rocky9.tar.gz
      sha256: 6883b2fac32873304d511cd4c47e35c7d982e0b3635c24e8b1a24e63845a424a
  - if: win
    then:
      path: ../../archive_files/AYON-${{ version }}-win.zip

build:
  number: 2
  prefix_detection:
    ignore_binary_files: true
  dynamic_linking:
    binary_relocation: false
    missing_dso_allowlist:
      - "**"
  # Run the packaging logic from separate bash scripts rather than inline commands.
  # Inline build.script commands are run by the build machine's default interpreter
  # (cmd.exe on Windows), which cannot parse these bash commands. A .sh file is always
  # run with bash via extension detection, so this works when building a linux target
  # from a Windows machine (cross-build). bash is available on the Deadline Cloud sample
  # Windows workers, so the win branch drives bash too.
  script:
    - if: unix
      then:
        - bash $RECIPE_DIR/build.sh
    - if: win
      then:
        - bash %RECIPE_DIR%\build_win.sh

tests:
  - if: unix
    then:
      script:
        - test -x $PREFIX/bin/ayon
        - test -f $PREFIX/opt/ayon-launcher/ayon
        - test -d $PREFIX/opt/ayon-launcher/dependencies
        - test -d $PREFIX/opt/ayon-launcher/lib
  - if: win
    then:
      script:
        - test -x $PREFIX/Scripts/ayon
        - test -f $PREFIX/opt/ayon-launcher/ayon_console.exe
        - test -d $PREFIX/opt/ayon-launcher/dependencies
        - test -d $PREFIX/opt/ayon-launcher/lib
        - test -f $PREFIX/etc/conda/activate.d/ayon-launcher.sh

about:
  summary: AYON Launcher for Deadline Cloud workers — provides the pipeline runtime for headless publishing.
  homepage: https://github.com/ynput/ayon-launcher
  license: Apache-2.0
