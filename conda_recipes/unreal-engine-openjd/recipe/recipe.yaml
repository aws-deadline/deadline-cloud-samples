
context:
  version: 0.6.5
  # build_number: Used for both version ordering (number) and filename (string).
  # Increment when rebuilding the same version. Output: unrealengine-openjd-0.6.5-{build_number}.conda
  build_number: 1

package:
  name: unrealengine-openjd
  version: ${{ version }}

source:
- url: https://pypi.org/packages/source/d/deadline-cloud-for-unreal-engine/deadline_cloud_for_unreal_engine-${{ version }}.tar.gz
  sha256: 36d3bd1b86ea8556ecb19e26b78c9bd152b544ac38ceaff7274c23035e8c8197

build:
  number: ${{ build_number }}
  string: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .
  python:
    entry_points:
    - unreal-engine-openjd = deadline.unreal_adaptor.UnrealAdaptor:main
    - unreal-engine-p4-utils = deadline.unreal_perforce_utils.cli:main

requirements:
  # rattler-build automatically adds python and python_abi as runtime dependencies in the generated repodata.json file.
  # Since this is an OpenJD adaptor package that will be installed into environments where Python is already present (and managed separately), 
  # we don't want rattler-build to inject these dependencies automatically. 
  # The ignore_run_exports directive prevents rattler-build from adding these implicit runtime dependencies while still allowing us to use them as build-time host dependencies.
  ignore_run_exports:
    by_name:
      - python_abi
      - python
  host:
  - python >=3.9
  - hatchling
  - hatch-vcs
  - pip


about:
  summary: AWS Deadline Cloud for Unreal Engine
  homepage: https://github.com/aws-deadline/deadline-cloud-for-unreal-engine
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE