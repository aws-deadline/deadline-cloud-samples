context:
  version: "0.44.0"
  comfy_cli_version: "1.22.0"
  # PyTorch for CUDA 13.0, from download.pytorch.org. torchaudio releases lag behind torch, so
  # these are one matching release rather than the newest of each.
  cuda_version: "13.0"
  torch_version: "2.11.0"
  torchvision_version: "0.26.0"
  torchaudio_version: "2.11.0"

package:
  name: comfy
  version: ${{ version }}

build:
  number: 0
  script:
    env:
      COMFYUI_VERSION: ${{ version }}
      COMFY_CLI_VERSION: ${{ comfy_cli_version }}
      CUDA_VERSION: ${{ cuda_version }}
      TORCH_VERSION: ${{ torch_version }}
      TORCHVISION_VERSION: ${{ torchvision_version }}
      TORCHAUDIO_VERSION: ${{ torchaudio_version }}
    content:
      - if: unix
        then:
          - bash $RECIPE_DIR/build.sh
  # Keep the pip-installed binary wheels (torch, nvidia-*, av) working as built.
  prefix_detection:
    ignore_binary_files: true
  dynamic_linking:
    binary_relocation: false
    missing_dso_allowlist:
      - "**"

requirements:
  # The pip-installed wheels are cp312.
  host:
    - python 3.12.*
    - pip
    - git
    # torch 2.11 requires setuptools<82. Conda installs setuptools too, since conda-forge's pip
    # depends on it, so it's limited here: otherwise pip replaces conda's copy in the package,
    # and conda installs a newer one in jobs, which pip check rejects.
    - setuptools <82
  run:
    - python 3.12.*
    # comfy-cli uses GitPython, which needs a git executable.
    - git
    # Needed at runtime, but pip skips them because they're already in the host env.
    - packaging >=20.9
    - setuptools <82

tests:
  - script:
      - COMFY_NO_TELEMETRY=1 comfy --skip-prompt --help
      - python "$COMFYUI_LOCATION/main.py" -h
      - python -c "import torch, torchvision, comfyui_frontend_package, comfy_kitchen, av"
      - python -c "import torch; print(torch.__version__); assert torch.version.cuda.startswith('13.'), torch.version.cuda"
      - test ! -d "$CONDA_PREFIX/opt/comfyui/.venv"
      - test -f "$CONDA_PREFIX/opt/comfyui/pip-freeze.txt"
      - test "$COMFYUI_LOCATION" = "$CONDA_PREFIX/opt/comfyui"
      - test "$PYTHONUNBUFFERED" = 1
      - test "$COMFY_NO_TELEMETRY" = 1
  - script:
      - bash test_comfy.sh
    files:
      recipe:
        - test_comfy.sh
        - test_workflow_api.json

about:
  homepage: https://github.com/Comfy-Org/ComfyUI
  # ComfyUI's license. comfy-cli and the bundled wheels have their own; see the README.
  license: GPL-3.0-only
  summary: >
    ComfyUI with PyTorch CUDA wheels for Linux GPU workers, and the comfy command for
    running it.
